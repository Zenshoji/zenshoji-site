<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>中陰年回表</title>

  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #ddd;
      color: #111;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
    }


    /* ========================================
       操作部分
    ======================================== */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 12px;

      background: #fff;

      border-bottom:
        1px solid #bbb;

      text-align: center;
    }

    .print-guide {
      margin-bottom: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 14px;
      line-height: 1.6;

      color: #555;
    }

    .toolbar-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .toolbar button {
      padding: 12px 22px;

      border: 0;
      border-radius: 6px;

      color: #fff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .back-button {
      background: #777;
    }

    .pdf-button {
      background: #333;
    }

    .print-button {
      background: #555;
    }

    .status {
      min-height: 22px;
      margin-top: 8px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 13px;

      color: #666;
    }


    /* ========================================
       A4横
    ======================================== */

    .page {
      position: relative;

      width: 297mm;
      height: 210mm;

      margin: 14mm auto;

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 2px 14px rgba(0,0,0,0.20);
    }

    .screen-fold {
      position: absolute;

      top: 0;
      bottom: 0;

      border-left:
        1px dashed #bbb;

      pointer-events: none;
    }

    .fold-1 {
      left: 99mm;
    }

    .fold-2 {
      left: 198mm;
    }


    /* ========================================
       縦中横
    ======================================== */

    .tcy {
      display: inline-block;

      width: 1em;

      text-align: center;

      writing-mode: horizontal-tb;
      text-orientation: upright;

      text-combine-upright: all;
      -webkit-text-combine: horizontal;

      line-height: 1;
    }

    .upright-digit {
      display: inline-block;

      width: 1em;

      text-align: center;

      text-orientation: upright;
    }

    .date-separator {
      display: inline-block;

      width: 1px;
      height: 0.42em;
    }


    /* ========================================
       寺院情報
       細身の独立モジュール。
       右に「曹洞宗」、左に「松久山」。
       その中央下に大きく縦書きで「禅昌寺」。
    ======================================== */

    .temple-info {
      position: absolute;

      left: 11.5mm;
      top: 24mm;

      width: 22mm;
      height: 160mm;

      border: 1px solid #999;

      background: #fff;

      overflow: hidden;
    }

    .temple-identity {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 50mm;

      border-bottom: 1px solid #aaa;
    }

    /*
      上段の2列
    */
    .temple-affiliation-pair {
      position: absolute;

      left: 0;
      top: 4mm;

      width: 100%;
      height: 17mm;
    }

    .temple-sect,
    .temple-mountain {
      position: absolute;

      top: 0;

      width: 5.5mm;
      height: 20mm;

      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 11pt;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      text-align: center;
      white-space: nowrap;

      /*
        3文字が詰まりすぎない程度に、
        縦方向の文字送りだけ少し広げる。
      */
      letter-spacing: 0.18em;
    }

    /*
      右：曹洞宗
    */
    .temple-sect {
      right: 5mm;
    }

    /*
      左：松久山
    */
    .temple-mountain {
      left: 5mm;
    }

    /*
      2列の中央下に禅昌寺
    */
    .temple-main-title {
      position: absolute;

      left: 50%;
      top: 20mm;

      width: 8mm;
      height: 25mm;

      transform: translateX(-50%);

      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 20pt;
      font-weight: 600;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      text-align: center;
      white-space: nowrap;

      letter-spacing: 0.08em;
    }

    /*
      下段：住所と電話を縦2列
    */
    .temple-contact {
      position: absolute;

      left: 0;
      top: 50mm;

      width: 100%;
      height: 110mm;

      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      justify-content: center;

      gap: 0.8mm;

      padding: 4mm 1.2mm 3mm;
    }

    .temple-contact-column {
      width: 8.2mm;
      height: 102mm;

      overflow: hidden;

      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;

      /*
        住所・電話は内容量に応じてJS側で最大化する。
        上限は「曹洞宗」「松久山」と同じ11pt。
      */
      font-size: 11pt;
      --temple-contact-step: 4mm;
      --temple-contact-space: 2.4mm;

      text-align: center;
    }

    .temple-address-char,
    .temple-address-digit {
      display: flex;

      width: 100%;
      height: var(--temple-contact-step);

      align-items: center;
      justify-content: center;

      line-height: 1;
    }

    .temple-address-hyphen {
      position: relative;

      display: block;

      width: 100%;
      height: var(--temple-contact-step);
    }

    .temple-address-hyphen::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 8%;
      bottom: 8%;

      width: 1px;

      background: #111;

      transform: translateX(-50%);
    }

    .temple-address-space {
      display: block;

      width: 100%;
      height: var(--temple-contact-space);
    }


    /* ========================================
       中陰表
    ======================================== */

    .chuin-area {
      position: absolute;

      left: 45mm;
      top: 6mm;

      width: 149mm;
      height: 198mm;
    }

    .chuin-title {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 22pt;
      font-weight: 600;

      letter-spacing: 0.18em;
    }

    .chuin-table {
      position: absolute;

      left: 0;
      top: 18mm;

      width: 100%;
      height: 130mm;

      border: 1px solid #333;

      display: grid;

      grid-template-columns:
        repeat(8, 1fr);
    }

    .chuin-column {
      border-right:
        1px solid #777;

      display: grid;
    }

    .chuin-column:last-child {
      border-right: 0;
    }

    .chuin-cell {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom:
        1px solid #999;

      overflow: hidden;
    }

    .chuin-cell:last-child {
      border-bottom: 0;
    }

    .chuin-name-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .chuin-main-name {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      /*
        ブラウザ差を避けるため縦組みを明示的に固定
      */
      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-size: var(--chuin-main-size);
      font-weight: 600;

      line-height: 1;

      white-space: nowrap;
      text-align: center;
    }

    .chuin-name-wrap.has-sub .chuin-main-name {
      /* 五七日・七七日も他の忌日と同じセル正中 */
      left: 50%;
    }

    .chuin-sub-name {
      position: absolute;
      /* 本体の中央軸を動かさず、左側余白だけを使う */
      left: 13%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-height: 90%;
      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;
      font-size: var(--chuin-note-size);
      line-height: 1;
      color: #444;
      white-space: nowrap;
    }

    .old-name {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: var(--chuin-old-size);

      color: #555;
    }

    .chuin-date {
      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-size: var(--chuin-date-size);

      line-height: 1.08;

      white-space: nowrap;

      max-height: 94%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thirteen-buddha {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: var(--chuin-buddha-size);

      color: #333;
    }


    /* ========================================
       中陰説明
    ======================================== */

    .chuin-description {
      position: absolute;

      left: 2mm;
      right: 2mm;

      top: 151mm;

      min-height: 42mm;

      padding: 3mm 3mm;

      border-top:
        1px solid #aaa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 9.5pt;
      line-height: 1.55;
    }

    .chuin-description strong {
      display: block;

      margin-bottom: 2mm;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 14pt;
    }


    /* ========================================
       位牌
    ======================================== */

    .ihai-area {
      position: absolute;

      left: 201mm;
      top: 10mm;

      width: 86mm;
      height: 190mm;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .ihai {
      position: relative;

      width: 60mm;
      height: 184mm;
    }

    .ihai-body {
      position: absolute;

      left: 7mm;
      right: 7mm;

      top: 20mm;
      bottom: 20mm;

      border:
        1.3px solid #222;

      border-radius:
        7mm 7mm 3mm 3mm;
    }

    .ihai-top {
      position: absolute;

      top: 3mm;
      left: 18mm;

      width: 24mm;
      height: 27mm;

      border-top:
        1.3px solid #222;

      border-left:
        1.3px solid #222;

      border-right:
        1.3px solid #222;

      transform:
        rotate(45deg);
    }

    .ihai-base-1 {
      position: absolute;

      bottom: 14mm;
      left: 4mm;

      width: 52mm;

      border-top:
        1.3px solid #222;
    }

    .ihai-base-2 {
      position: absolute;

      bottom: 9mm;
      left: 9mm;

      width: 42mm;

      border-top:
        1.3px solid #222;
    }

    .ihai-main {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 10mm;
      height: 132mm;

      transform: translate(-50%, -50%);

      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: var(--ihai-kaimyo-size);
      font-weight: 600;

      letter-spacing: 0.10em;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .ihai-date {
      position: absolute;

      /*
        戒名の正中から左右とも完全に同距離。
        ボックス幅を1文字相当にして、
        縦書き文字そのものの軸も左右対称にする。
      */
      left: calc(50% + 12.5mm);
      top: 50%;

      width: 1.08em;
      height: auto;
      max-height: 126mm;

      transform: translate(-50%, -50%);

      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-size: var(--ihai-side-size);
      line-height: 1;

      text-align: center;
      white-space: nowrap;

      overflow: visible;
    }

    .ihai-left {
      position: absolute;

      /*
        戒名の正中から左右とも完全に同距離。
        ボックス幅を1文字相当にして、
        縦書き文字そのものの軸も左右対称にする。
      */
      left: calc(50% - 12.5mm);
      top: 50%;

      width: 1.08em;
      height: auto;
      max-height: 126mm;

      transform: translate(-50%, -50%);

      writing-mode: vertical-rl !important;
      -webkit-writing-mode: vertical-rl !important;
      text-orientation: upright !important;

      font-size: var(--ihai-side-size);
      line-height: 1;

      text-align: center;
      white-space: nowrap;

      overflow: visible;
    }


    /* ========================================
       年回表
    ======================================== */

    .back-extra {
      position: absolute;

      left: 12mm;
      top: 20mm;

      width: 70mm;
      height: 170mm;
    }

    .nenkai-area {
      position: absolute;

      left: 78mm;
      top: 6mm;

      width: 213mm;
      height: 198mm;
    }

    .nenkai-title {
      width: 100%;

      text-align: center;

      font-size: 22pt;
      font-weight: 600;

      letter-spacing: 0.18em;
    }

    .nenkai-table {
      position: absolute;

      left: 0;
      top: 18mm;

      width: 100%;
      height: 108mm;

      border: 1px solid #333;

      display: grid;

      grid-template-columns:
        repeat(10, 1fr);
    }

    .nenkai-column {
      display: grid;

      border-right:
        1px solid #777;
    }

    .nenkai-column:last-child {
      border-right: 0;
    }

    .nenkai-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom:
        1px solid #999;

      overflow: hidden;
    }

    .nenkai-cell:last-child {
      border-bottom: 0;
    }

    .nenkai-name {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      writing-mode: horizontal-tb;
      text-orientation: upright;

      font-size: var(--nenkai-name-size);
      font-weight: 600;
    }

    .nenkai-name-slots {
      width: 100%;
      height: 88%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .nenkai-name-char {
      display: flex;
      width: 100%;
      height: 1em;

      align-items: center;
      justify-content: center;

      line-height: 1;
    }

    .nenkai-year {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: var(--nenkai-year-size);

      line-height: 1.15;
    }

    .nenkai-buddha {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: var(--nenkai-buddha-size);

      color: #333;
    }


    .houji-description {
      position: absolute;

      left: 0;
      right: 0;
      top: 129mm;

      min-height: 64mm;

      padding: 3mm 3mm;

      border-top: 1px solid #aaa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 9.5pt;
      line-height: 1.55;
    }

    .houji-description strong {
      display: block;
      margin-bottom: 2mm;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 11.5pt;
    }


    /* ========================================
       印刷
    ======================================== */

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {

      html,
      body {
        background: #fff;
      }

      .toolbar {
        display: none;
      }

      .page {
        width: 297mm;
        height: 210mm;

        margin: 0;

        box-shadow: none;

        page-break-after:
          always;
      }

      .page:last-child {
        page-break-after:
          auto;
      }

      .screen-fold {
        display: none;
      }

    }

    @media
    screen and
    (max-width: 900px) {

      .page-wrapper {
        width: 297mm;

        transform-origin:
          top left;

        transform:
          scale(0.42);

        margin-bottom:
          -115mm;
      }

    }

    @media
    screen and
    (max-width: 600px) {

      .toolbar-buttons {
        flex-direction: column;
      }

      .toolbar button {
        width: 100%;
      }

    }

  
    :root {
      --chuin-main-size: 20pt;
      --chuin-old-size: 20pt;
      --chuin-date-size: 18pt;
      --chuin-buddha-size: 14pt;
      --chuin-note-size: 9pt;

      --nenkai-name-size: 20pt;
      --nenkai-year-size: 20pt;
      --nenkai-buddha-size: 14pt;

      --ihai-kaimyo-size: 24pt;
      --ihai-side-size: 14pt;

      --temple-sect-size: 15pt;
      --temple-name-size: 17pt;
      --temple-address-size: 11pt;
    }


    .chuin-name-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .chuin-name-wrap .chuin-name {
      position: absolute;
      right: 10%;
      top: 50%;
      transform: translateY(-50%);
      height: 88%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chuin-name-wrap .chuin-sub-name {
      position: absolute;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      height: 88%;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      text-orientation: upright;
      line-height: 1.05;
    }

.nenkai-table.with-buddha {
      grid-template-rows:
        0.34fr
        0.34fr
        0.32fr !important;
    }


    .temple-contact::after {
      /*
        下段セルを縦に伸ばしても自動で全高へ追従
      */
      content: "";

      position: absolute;

      left: 50%;
      top: 3mm;
      bottom: 3mm;

      width: 1px;

      background: #bbb;

      transform: translateX(-50%);
    }

    .temple-contact-column {
      position: relative;
      z-index: 1;
    }
</style>
</head>


<body>


  <div class="toolbar">

    <div class="print-guide">
      「PDFを保存」はPDFファイルを直接保存します。<br>
      「印刷する」はプリンターの印刷画面を開きます。
    </div>


    <div class="toolbar-buttons">

      <button
        type="button"
        class="back-button"
        onclick="history.back()"
      >
        戻る
      </button>


      <button
        type="button"
        class="pdf-button"
        id="pdfSaveButton"
      >
        PDFを保存
      </button>


      <button
        type="button"
        class="print-button"
        onclick="window.print()"
      >
        印刷する
      </button>

    </div>


    <div
      class="status"
      id="status"
    ></div>

  </div>


  <div class="page-wrapper">


    <!-- 表面 -->

    <section class="page front">

      <div class="screen-fold fold-1"></div>
      <div class="screen-fold fold-2"></div>


      <div class="temple-info">

        <div class="temple-identity">

          <div class="temple-affiliation-pair">

            <div
              class="temple-sect"
              id="templeSect"
            ></div>

            <div
              class="temple-mountain"
              id="templeMountain"
            ></div>

          </div>

          <div
            class="temple-main-title"
            id="templeMainTitle"
          ></div>

        </div>

        <div class="temple-contact">

          <div
            class="temple-contact-column"
            id="templeAddress"
          ></div>

          <div
            class="temple-contact-column"
            id="templePhone"
          ></div>

        </div>

      </div>


      <div class="chuin-area">

        <div class="chuin-title">
          中　陰　表
        </div>


        <div
          class="chuin-table"
          id="chuinTable"
        ></div>


        <div class="chuin-description">

          <strong>
            中陰とは
          </strong>

          ご命日から四十九日までの期間を「中陰」といいます。<br>

          この間、初七日から七七日（四十九日）まで、
          七日ごとに忌日を迎え、故人を偲びご供養を勤めます。

        </div>

      </div>


      <div class="ihai-area">

        <div class="ihai">

          <div class="ihai-top"></div>
          <div class="ihai-body"></div>
          <div class="ihai-base-1"></div>
          <div class="ihai-base-2"></div>

          <div
            class="ihai-date"
            id="ihaiDate"
          ></div>

          <div
            class="ihai-main"
            id="ihaiMain"
          ></div>

          <div
            class="ihai-left"
            id="ihaiLeft"
          ></div>

        </div>

      </div>

    </section>



    <!-- 裏面 -->

    <section class="page back">

      <div class="screen-fold fold-1"></div>
      <div class="screen-fold fold-2"></div>


      <div class="back-extra"></div>


      <div class="nenkai-area">

        <div class="nenkai-title">

    const thirteenBuddhas = {

    /*

    function splitChuinName(

    ) {

      if (

      ) {

          main:

          sub:
            "（三十五日）"

          main:
            "七七日",

          sub:
            "（四十九日）"
        };

      }


      return {
        main:
          name,

        sub:
          ""
      };

    }


    /*
      ========================================
      HTMLエスケープ
    ========================================
    */

    function escapeHtml(
      text
    ) {

      return String(text)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function distributedVerticalNameHtml(
      value

      return (
        '<div class="nenkai-name-slots">' +
        Array.from(
          String(value || "")

          .map(
            function(char) {
              return (
                '<span class="nenkai-name-char">' +
                escapeHtml(char) +
                '</span>'
              );
            }
          )
          .join("") +
        '</div>'
      );

    }


    function formatTempleNameHtml(
      name
    ) {

      const raw =
        String(
          name || ""
        )
          .replace(/\s+/g, " ")
          .trim();


      const sect =
        raw.includes("曹洞宗")
          ? "曹洞宗"
          : "";


      const rest =
        raw
          .replace("曹洞宗", "")
          .trim();


      const parts =
        rest
          .split(/\s+/)
          .filter(Boolean);


      const mountain =
        parts[0] || "松久山";


      const temple =
        parts.slice(1).join("") || "禅昌寺";


      function chars(
        value
      ) {

        return Array.from(
          value
        )
          .map(
            function(char) {
              return (
                '<span class="temple-name-char">' +
                escapeHtml(char) +
                '</span>'
              );
            }
          )
          .join("");

      }


      return (
        '<div class="temple-name-stack">' +

          '<div class="temple-name-group sect">' +
            chars(sect) +
          '</div>' +

          '<div class="temple-name-group main">' +
            chars(mountain) +
            chars(temple) +
          '</div>' +

        '</div>'
      );

    }


    /*
      ========================================
      寺院情報専用HTML

      1文字ずつ同じ中心軸へ積む。
      ハイフンだけ専用縦線。
    ========================================
    */

    /*
      ========================================
      寺院情報：住所・電話の自動最大化

      有効高102mmに必ず収めながら、
      住所・電話をそれぞれ可能な限り大きくする。
      上限は「曹洞宗」「松久山」と同じ11pt。
    ========================================
    */
    function fitTempleContactColumn(
      element
    ) {

      if (!element) return;

      const normalItems =
        element.querySelectorAll(
          ".temple-address-char, .temple-address-digit, .temple-address-hyphen"
        ).length;

      const spaceItems =
        element.querySelectorAll(
          ".temple-address-space"
        ).length;

      if (
        normalItems === 0 &&
        spaceItems === 0
      ) {
        return;
      }

      const availableMm = 102;
      const maxFontPt = 11;
      const ptToMm = 0.352778;

      /*
        通常文字はフォント高の約1.08倍、
        空白は通常文字送りの約60%として計算。
      */
      const effectiveUnits =
        normalItems +
        spaceItems * 0.60;

      const maxStepMm =
        maxFontPt *
        ptToMm *
        1.08;

      const stepMm =
        Math.min(
          maxStepMm,
          availableMm / effectiveUnits
        );

      /*
        念のためごく小さい安全余白を取り、
        ブラウザ差で最下部が切れないようにする。
      */
      const safeStepMm =
        stepMm * 0.985;

      const fontPt =
        Math.min(
          maxFontPt,
          safeStepMm /
            (ptToMm * 1.08)
        );

      element.style.fontSize =
        fontPt.toFixed(2) +
        "pt";

      element.style.setProperty(
        "--temple-contact-step",
        safeStepMm.toFixed(3) +
        "mm"
      );

      element.style.setProperty(
        "--temple-contact-space",
        (safeStepMm * 0.60).toFixed(3) +
        "mm"
      );

    }


    function templeVerticalHtml(
      text
    ) {

      const characters =
        Array.from(
          String(text)
        );


      let html =
        "";


      characters.forEach(

        function (
          char
        ) {


          /*
            全角・半角空白
          */

          if (
            char === " " ||
            char === "　"
          ) {

            html +=
              '<span class="temple-address-space"></span>';

            return;

          }


          /*
            ハイフン類
          */

          if (
            char === "-" ||
            char === "－" ||
            char === "‐" ||
            char === "―" ||
            char === "–" ||
            char === "—"
          ) {

            html +=
              '<span class="temple-address-hyphen"></span>';

            return;

          }


          /*
            数字
          */

          if (
            /^[0-9]$/.test(
              char
            )
          ) {

            html +=

              '<span class="temple-address-digit">' +

              escapeHtml(
                char
              ) +

              "</span>";

            return;

          }


          /*
            通常文字
          */

          html +=

            '<span class="temple-address-char">' +

            escapeHtml(
              char
            ) +

            "</span>";

        }

      );


      return html;

    }


    /*
      ========================================
      一般縦書きHTML
    ========================================
    */

    function verticalHtml(
      text,
      options = {}
    ) {

      const addDateSpacing =
        options.dateSpacing === true;


      const characters =
        Array.from(
          String(text)
        );


      let html =
        "";


      let numberBuffer =
        "";


      function flushNumbers() {

        if (
          !numberBuffer
        ) {

          return;

        }


        if (
          numberBuffer.length <= 2
        ) {

          html +=
            '<span class="tcy">' +
            escapeHtml(
              numberBuffer
            ) +
            "</span>";

        }

        else {

          Array.from(
            numberBuffer
          )
            .forEach(

              function (
                digit
              ) {

                html +=
                  '<span class="upright-digit">' +
                  digit +
                  "</span>";

              }

            );

        }


        numberBuffer =
          "";

      }


      characters.forEach(

        function (
          char
        ) {

          if (
            /^[0-9]$/.test(
              char
            )
          ) {

            numberBuffer +=
              char;

            return;

          }


          flushNumbers();


          html +=
            escapeHtml(
              char
            );


          if (
            addDateSpacing &&
            (
              char === "年" ||
              char === "月"
            )
          ) {

            html +=
              '<span class="date-separator"></span>';

          }

        }

      );


      flushNumbers();


      return html;

    }


    /*
      ========================================
      漢数字
    ========================================
    */

    function numberToKanji(
      n
    ) {

      const digits = [
        "",
        "一",
        "二",
        "三",
        "四",
        "五",
        "六",
        "七",
        "八",
        "九"
      ];


      n =
        Number(n);


      if (n < 10) {
        return digits[n];
      }


      if (n === 10) {
        return "十";
      }


      if (n < 20) {

        return (
          "十" +
          digits[n - 10]
        );

      }


      if (n < 100) {

        const tens =
          Math.floor(
            n / 10
          );


        const ones =
          n % 10;


        return (
          digits[tens] +
          "十" +
          digits[ones]
        );

      }


      if (n < 1000) {

        const hundreds =
          Math.floor(
            n / 100
          );


        const remainder =
          n % 100;


        let result =
          "";


        result +=
          hundreds === 1
            ? "百"
            : digits[hundreds] +
              "百";


        if (
          remainder
        ) {

          result +=
            numberToKanji(
              remainder
            );

        }


        return result;

      }


      return String(n);

    }


    function japaneseDateToKanji(
      text
    ) {

      const match =
        String(text)
          .match(
            /^(大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日$/
          );


      if (!match) {
        return text;
      }


      const era =
        match[1];


      const year =
        match[2] === "元"
          ? "元"
          : numberToKanji(
              Number(
                match[2]
              )
            );


      const month =
        numberToKanji(
          Number(
            match[3]
          )
        );


      const day =
        numberToKanji(
          Number(
            match[4]
          )
        );


      return (
        era +
        year +
        "年" +
        month +
        "月" +
        day +
        "日"
      );

    }


    function ageToKanji(
      age
    ) {

      if (!age) {
        return "";
      }


      return (
        numberToKanji(
          Number(age)
        ) +
        "歳"
      );

    }

    /*

    ========================================
    */

    function alignIhaiSideColumnTops() {

      /*
        1. CSSで左右列をそれぞれ縦中央揃えする。
        2. 実際に描画された2列のうち、頭が高い方を取得。
        3. 低い方も同じ高さへ揃える。
        左右の文字軸は戒名中心から±12.5mmで完全対称。
      */

      const ihai =
        document.querySelector(
          ".ihai"
        );


      const dateEl =
        document.getElementById(
          "ihaiDate"
        );


      const leftEl =
        document.getElementById(
          "ihaiLeft"
        );


      if (
        !ihai ||
        !dateEl ||
        !leftEl
      ) {
        return;
      }


      /*
        一度、両方を本来の中央揃えへ戻す
      */

      [dateEl, leftEl]
        .forEach(
          function(el) {
            el.style.top = "50%";
            el.style.transform =
              "translate(-50%, -50%)";
          }
        );


      requestAnimationFrame(
        function() {

          const parentRect =
            ihai.getBoundingClientRect();


          const dateRect =
            dateEl.getBoundingClientRect();


          const leftRect =
            leftEl.getBoundingClientRect();


          const targetTop =
            Math.min(
              dateRect.top,
              leftRect.top
            ) -
            parentRect.top;


          [dateEl, leftEl]
            .forEach(
              function(el) {

                el.style.top =
                  targetTop + "px";


                /*
                  縦方向のtranslateは外し、
                  X方向だけ中央軸を維持
                */

                el.style.transform =
                  "translateX(-50%)";

              }
            );

        }
      );

    }

    /*
      ========================================
      ここから下はPDF生成用。
      今回（ブラウザ確認段階）の修正では変更していない。
      ========================================
    */


    /*
      ========================================
      Canvas基本
    ========================================
    */

    const PDF_SCALE =
      10;


    const PAGE_W_MM =
      297;


    const PAGE_H_MM =
      210;


    function mm(
      value
    ) {

      return (
        value *
        PDF_SCALE
      );

    }


    function createPageCanvas() {

      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        mm(
          PAGE_W_MM
        );


      canvas.height =
        mm(
          PAGE_H_MM
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#111111";


      ctx.strokeStyle =
        "#222222";


      return {
        canvas,
        ctx
      };

    }


    function setFont(
      ctx,
      sizePx,
      weight = "normal",
      family = "serif"
    ) {

      const families =
        family === "sans"
          ? '"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif'
          : '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif';


      ctx.font =
        weight +
        " " +
        sizePx +
        "px " +
        families;


      ctx.textBaseline =
        "top";

    }


    function tokenizeVerticalText(
      text
    ) {

      const characters =
        Array.from(
          String(text)
        );


      const tokens =
        [];


      let numberBuffer =
        "";


      characters.forEach(

        function (
          char
        ) {

          if (
            /^[0-9]$/.test(
              char
            )
          ) {

            numberBuffer +=
              char;

            return;

          }


          if (
            numberBuffer
          ) {

            tokens.push(
              numberBuffer
            );


            numberBuffer =
              "";

          }


          tokens.push(
            char
          );

        }

      );


      if (
        numberBuffer
      ) {

        tokens.push(
          numberBuffer
        );

      }


      return tokens;

    }


    /*
      ========================================
      Canvas縦括弧

      フォント文字を使用せず、
      縦組み用の弧を直接描く。
    ========================================
    */

    function drawVerticalParenthesis(
      ctx,
      x,
      y,
      size,
      type
    ) {

      ctx.save();


      ctx.beginPath();


      ctx.lineWidth =
        Math.max(
          1,
          size *
          0.075
        );


      /*
        開き括弧
        上側の弧
      */

      if (
        type === "open"
      ) {

        ctx.moveTo(
          x -
          size *
          0.34,
          y +
          size *
          0.60
        );


        ctx.quadraticCurveTo(
          x,
          y +
          size *
          0.12,
          x +
          size *
          0.34,
          y +
          size *
          0.60
        );

      }


      /*
        閉じ括弧
        下側の弧
      */

      else {

        ctx.moveTo(
          x -
          size *
          0.34,
          y +
          size *
          0.40
        );


        ctx.quadraticCurveTo(
          x,
          y +
          size *
          0.88,
          x +
          size *
          0.34,
          y +
          size *
          0.40
        );

      }


      ctx.stroke();


      ctx.restore();

    }


    /*
      ========================================
      PDF縦書き
    ========================================
    */

    function drawVerticalText(
      ctx,
      text,
      x,
      y,
      options = {}
    ) {

      const size =
        options.size ||
        mm(3.5);


      const gap =
        options.gap ||
        size *
        1.14;


      const maxHeight =
        options.maxHeight ||
        Infinity;


      const weight =
        options.weight ||
        "normal";


      const family =
        options.family ||
        "serif";


      const dateSpacing =
        options.dateSpacing === true;


      const extraDateGap =
        options.extraDateGap ||
        size *
        0.42;


      /*
        （三十五日）（四十九日）専用

        trueの場合、括弧をCanvasで
        縦組み用に直接描画する。
      */

      const verticalParentheses =
        options.verticalParentheses === true;


      const tokens =
        tokenizeVerticalText(
          text
        );


      let yy =
        y;


      for (
        const token of tokens
      ) {

        if (
          yy -
          y +
          gap >
          maxHeight
        ) {

          break;

        }


        /*
          1～2桁数字
        */

        if (
          /^\d{1,2}$/.test(
            token
          )
        ) {

          ctx.save();


          setFont(
            ctx,
            size * 0.90,
            weight,
            family
          );


          ctx.textAlign =
            "center";


          ctx.textBaseline =
            "middle";


          const measured =
            ctx.measureText(
              token
            ).width;


          const maxWidth =
            size *
            0.96;


          let scaleX =
            1;


          if (
            measured >
            maxWidth
          ) {

            scaleX =
              maxWidth /
              measured;

          }


          ctx.translate(
            x,
            yy +
            size *
            0.50
          );


          ctx.scale(
            scaleX,
            1
          );


          ctx.fillText(
            token,
            0,
            0
          );


          ctx.restore();


          yy +=
            gap;


          continue;

        }


        /*
          3桁以上数字
        */

        if (
          /^\d+$/.test(
            token
          )
        ) {

          for (
            const digit of
            Array.from(
              token
            )
          ) {

            if (
              yy -
              y +
              gap >
              maxHeight
            ) {

              break;

            }


            setFont(
              ctx,
              size,
              weight,
              family
            );


            ctx.textAlign =
              "center";


            ctx.textBaseline =
              "top";


            ctx.fillText(
              digit,
              x,
              yy
            );


            yy +=
              gap;

          }


          continue;

        }


        /*
          括弧
        */

        if (
          token === "(" ||
          token === "（" ||
          token === ")" ||
          token === "）"
        ) {

          /*
            （三十五日）（四十九日）は
            Canvasで縦括弧を直接描く
          */

          if (
            verticalParentheses
          ) {

            drawVerticalParenthesis(
              ctx,
              x,
              yy,
              size,
              (
                token === "(" ||
                token === "（"
              )
                ? "open"
                : "close"
            );

          }

          else {

            /*
              その他の括弧は通常の縦組み処理
            */

            ctx.save();


            setFont(
              ctx,
              size,
              weight,
              family
            );


            ctx.translate(
              x,
              yy +
              size /
              2
            );


            ctx.rotate(
              Math.PI /
              2
            );


            ctx.textAlign =
              "center";


            ctx.textBaseline =
              "middle";


            ctx.fillText(
              token === "(" ||
              token === "（"
                ? "（"
                : "）",
              0,
              0
            );


            ctx.restore();

          }


          yy +=
            gap;


          continue;

        }


        /*
          ハイフン

          PDF側は既に正常なので
          同じ中心軸処理を維持
        */

        if (
          token === "-" ||
          token === "－" ||
          token === "ー" ||
          token === "―" ||
          token === "‐" ||
          token === "–" ||
          token === "—"
        ) {

          ctx.save();


          ctx.beginPath();


          ctx.lineWidth =
            Math.max(
              1,
              size *
              0.065
            );


          ctx.moveTo(
            x,
            yy +
            size *
            0.05
          );


          ctx.lineTo(
            x,
            yy +
            size *
            0.95
          );


          ctx.stroke();


          ctx.restore();


          yy +=
            gap;


          continue;

        }


        /*
          通常文字
        */

        setFont(
          ctx,
          size,
          weight,
          family
        );


        ctx.textAlign =
          "center";


        ctx.textBaseline =
          "top";


        ctx.fillText(
          token,
          x,
          yy
        );


        yy +=
          gap;


        if (
          dateSpacing &&
          (
            token === "年" ||
            token === "月"
          )
        ) {

          yy +=
            extraDateGap;

        }

      }

    }



    function measureVerticalTextHeight(
      text,
      options = {}
    ) {

      const size =
        options.size ||
        mm(3.5);

      const gap =
        options.gap ||
        size * 1.14;

      const dateSpacing =
        options.dateSpacing === true;

      const extraDateGap =
        options.extraDateGap ||
        size * 0.42;

      const tokens =
        tokenizeVerticalText(
          text
        );

      let height = 0;

      tokens.forEach(
        function(token) {

          if (/^\d{3,}$/.test(token)) {
            height +=
              Array.from(token).length *
              gap;
          }
          else {
            height += gap;
          }

          if (
            dateSpacing &&
            (
              token === "年" ||
              token === "月"
            )
          ) {
            height += extraDateGap;
          }

        }
      );

      return height;

    }


    function drawVerticalTextCentered(
      ctx,
      text,
      x,
      areaTop,
      areaHeight,
      options = {}
    ) {

      const contentHeight =
        measureVerticalTextHeight(
          text,
          options
        );

      const startY =
        areaTop +
        Math.max(
          0,
          (
            areaHeight -
            contentHeight
          ) / 2
        );

      drawVerticalText(
        ctx,
        text,
        x,
        startY,
        {
          ...options,
          maxHeight:
            Math.min(
              options.maxHeight || areaHeight,
              areaHeight
            )
        }
      );

    }



    function fitVerticalFontSize(
      text,
      cellWidth,
      cellHeight,
      options = {}
    ) {

      const maxSize =
        options.maxSize ||
        cellWidth * 0.78;

      const minSize =
        options.minSize ||
        mm(1.8);

      const widthLimit =
        cellWidth *
        (options.widthRatio || 0.78);

      let size =
        Math.min(
          maxSize,
          widthLimit
        );

      const gapRatio =
        options.gapRatio || 1.12;

      const dateSpacing =
        options.dateSpacing === true;

      const extraGapRatio =
        options.extraGapRatio || 0.36;

      while (
        size > minSize
      ) {

        const gap =
          size * gapRatio;

        const extraDateGap =
          size * extraGapRatio;

        const needed =
          measureVerticalTextHeight(
            text,
            {
              size,
              gap,
              dateSpacing,
              extraDateGap
            }
          );

        if (
          needed <=
          cellHeight * 0.90
        ) {
          break;
        }

        size -=
          mm(0.08);

      }

      return size;

    }


    function drawVerticalTextFitCentered(
      ctx,
      text,
      centerX,
      cellTop,
      cellWidth,
      cellHeight,
      options = {}
    ) {

      const size =
        fitVerticalFontSize(
          text,
          cellWidth,
          cellHeight,
          options
        );

      const gap =
        size *
        (options.gapRatio || 1.12);

      const extraDateGap =
        size *
        (options.extraGapRatio || 0.36);

      drawVerticalTextCentered(
        ctx,
        text,
        centerX,
        cellTop,
        cellHeight,
        {
          size,
          gap,
          weight:
            options.weight || "normal",
          family:
            options.family || "serif",
          dateSpacing:
            options.dateSpacing === true,
          extraDateGap,
          verticalParentheses:
            options.verticalParentheses === true
        }
      );

    }



    function drawVerticalDistributed(
      ctx,
      value,
      x,
      areaTop,
      areaHeight,
      options = {}
    ) {

      const chars =
        Array.from(
          String(value || "")
        );


      const size =
        options.size ||
        mm(8.45);


      const weight =
        options.weight ||
        "600";


      const usable =
        areaHeight * 0.84;


      const start =
        areaTop +
        (
          areaHeight -
          usable
        ) / 2;


      const actualGap =
        chars.length > 1
          ? usable / (chars.length - 1)
          : 0;


      setFont(
        ctx,
        size,
        weight,
        "serif"
      );


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      chars.forEach(
        function(char, index) {

          const yy =
            chars.length === 1
              ? areaTop + areaHeight / 2
              : start + actualGap * index;


          ctx.fillText(
            char,
            x,
            yy
          );

        }
      );

    }


    function drawCenteredText(
      ctx,
      text,
      centerX,
      y,
      size,
      weight = "normal",
      family = "serif"
    ) {

      setFont(
        ctx,
        size,
        weight,
        family
      );


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "top";


      ctx.fillText(
        text,
        centerX,
        y
      );

    }


    /*
      ========================================
      位牌
    ========================================
    */

    function drawIhaiCanvas(
      ctx
    ) {

      /*
        位牌の左右位置は従来値を維持。
        三つ折り時の中央位置を動かさない。
      */

      const left =
        mm(214);

      const top =
        mm(14);

      const width =
        mm(60);

      const height =
        mm(182);


      ctx.lineWidth =
        mm(0.25);


      ctx.strokeRect(
        left + mm(7),
        top + mm(19),
        width - mm(14),
        height - mm(39)
      );


      ctx.beginPath();

      ctx.moveTo(
        left + mm(18),
        top + mm(19)
      );

      ctx.lineTo(
        left + width / 2,
        top + mm(5)
      );

      ctx.lineTo(
        left + width - mm(18),
        top + mm(19)
      );

      ctx.stroke();


      ctx.beginPath();

      ctx.moveTo(
        left + mm(4),
        top + height - mm(15)
      );

      ctx.lineTo(
        left + width - mm(4),
        top + height - mm(15)
      );

      ctx.moveTo(
        left + width / 2 - mm(12.5),
        top + height - mm(9)
      );

      ctx.lineTo(
        left + width / 2 + mm(12.5),
        top + height - mm(9)
      );

      ctx.stroke();


      /*
        将来の位牌挿絵を想定した文字安全領域。
        3列ともこの範囲の縦中央へ配置する。
      */

      const safeTop =
        top + mm(27);

      const safeHeight =
        mm(126);


      drawVerticalText(
        ctx,
        japaneseDateToKanji(
          data.deathDateJapanese
        ),
        left + width / 2 + mm(12.5),
        safeTop,
        {
          size: mm(5.0),
          gap: mm(5.35),
          extraDateGap: mm(1.35),
          dateSpacing: true,
          maxHeight: safeHeight
        }
      );


      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {

        drawVerticalTextCentered(
          ctx,
          data.kaimyo.trim(),
          left + width / 2,
          safeTop,
          safeHeight,
          {
            size:
              mm(8.45),

            gap:
              mm(8.7),

            weight:
              "600"
          }
        );


        const leftParts = [];


        if (
          data.name &&
          data.name.trim()
        ) {

          leftParts.push(
            "俗名　" +
            data.name.trim()
          );

        }


        if (
          data.age
        ) {

          leftParts.push(
            "行年　" +
            ageToKanji(
              data.age
            )
          );

        }


        if (
          leftParts.length
        ) {

          /*
            俗名と行年は同じ縦列内に上下配置。
            項目名と内容の間には全角空白を入れる。
          */

          const leftText =
            leftParts.join(
              "　　　　　　　　　"
            );


          drawVerticalText(
            ctx,
            leftText,
            left + width / 2 - mm(12.5),
            safeTop,
            {
              size: mm(5.0),
              gap: mm(5.35),
              maxHeight: safeHeight
            }
          );

        }

      }

      else {

        const name =
          data.name
            ? data.name.trim()
            : "";


        const cx =
          left +
          width /
          2;


        const mainText =
          "俗名　" +
          name +
          "　之精霊位";


        drawVerticalTextCentered(
          ctx,
          mainText,
          cx,
          safeTop,
          safeHeight,
          {
            size:
              mm(5.3),

            gap:
              mm(5.85),

            weight:
              "600"
          }
        );


        if (
          data.age
        ) {

          drawVerticalTextCentered(
            ctx,
            "行年　" +
            ageToKanji(
              data.age
            ),
            left +
            mm(10),
            safeTop,
            safeHeight,
            {
              size:
                mm(3.45),

              gap:
                mm(3.95)
            }
          );

        }

      }

    }

    /*
      ========================================
      表面PDF
    ========================================
    */

    function renderFrontCanvas() {

      const {
        canvas,
        ctx
      } =
        createPageCanvas();


      /*
        寺院情報
      */

      if (
        showTempleInfo
      ) {
        const boxX=mm(9), boxY=mm(24), boxW=mm(27), boxH=mm(130);
        const splitY=boxY+mm(43);

        ctx.save();
        ctx.lineWidth=mm(0.14);
        ctx.strokeStyle="#888";
        ctx.beginPath();
        ctx.moveTo(boxX,boxY); ctx.lineTo(boxX,boxY+boxH);
        ctx.moveTo(boxX+boxW,boxY); ctx.lineTo(boxX+boxW,boxY+boxH);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(boxX,splitY); ctx.lineTo(boxX+boxW,splitY);
        ctx.stroke();
        ctx.restore();

        drawCenteredText(ctx,"曹洞宗　松久山",boxX+boxW/2,boxY+mm(9),{size:mm(3.7),weight:"400"});
        drawCenteredText(ctx,"禅昌寺",boxX+boxW/2,boxY+mm(24),{size:mm(7.0),weight:"600"});

        drawVerticalText(ctx,data.temple.postal+"　"+data.temple.address,boxX+mm(18),splitY+mm(4),{
          size:mm(3.15),gap:mm(3.35),maxHeight:mm(79),family:"sans"
        });
        drawVerticalText(ctx,"電話　"+data.temple.tel,boxX+mm(8),splitY+mm(4),{
          size:mm(3.15),gap:mm(3.35),maxHeight:mm(79),family:"sans"
        });
      }


      drawCenteredText(
        ctx,
        "中　陰　表",
        mm(119.5),
        mm(7),
        mm(7.3),
        "600"
      );


      const tableX =
        mm(45);

      const tableY =
        mm(24);

      const tableW =
        mm(149);

      const tableH =
        mm(108);

      const columnCount =
        8;

      const columnW =
        tableW /
        columnCount;


      let rowRatios;


      if (
        showOldNames &&
        showThirteenBuddhas
      ) {

        rowRatios = [
          0.17,
          0.29,
          0.34,
          0.20
        ];

      }

      else if (
        showOldNames
      ) {

        rowRatios = [
          0.22,
          0.33,
          0.45
        ];

      }

      else if (
        showThirteenBuddhas
      ) {

        rowRatios = [
          0.31,
          0.43,
          0.26
        ];

      }

      else {

        rowRatios = [
          0.42,
          0.58
        ];

      }


      const rowStarts = [
        tableY
      ];


      let cumulative =
        0;


      for (
        let i = 0;
        i <
        rowRatios.length -
        1;
        i++
      ) {

        cumulative +=
          rowRatios[i];


        rowStarts.push(
          tableY +
          tableH *
          cumulative
        );

      }


      ctx.lineWidth =
        mm(0.18);


      ctx.strokeRect(
        tableX,
        tableY,
        tableW,
        tableH
      );


      ctx.beginPath();


      for (
        let i = 1;
        i < columnCount;
        i++
      ) {

        const x =
          tableX +
          columnW *
          i;


        ctx.moveTo(
          x,
          tableY
        );


        ctx.lineTo(
          x,
          tableY +
          tableH
        );

      }


      rowStarts
        .slice(1)
        .forEach(

          function (
            y
          ) {

            ctx.moveTo(
              tableX,
              y
            );


            ctx.lineTo(
              tableX +
              tableW,
              y
            );

          }

        );


      ctx.stroke();


      const chuin =
        [
          ...data.chuin
        ].reverse();


      chuin.forEach(

        function (
          item,
          index
        ) {

          const cx =
            tableX +
            columnW *
            index +
            columnW /
            2;


          let rowIndex =
            0;


          /*
            旧呼称
          */

          if (
            showOldNames
          ) {

            if (
              item.oldName
            ) {

              drawVerticalTextCentered(
                ctx,
                item.oldName,
                cx,
                rowStarts[rowIndex],
                tableH * rowRatios[rowIndex],
                {
                  size: mm(7.05),
                  gap: mm(7.35)
                }
              );

            }


            rowIndex++;

          }


          /*
            忌日
          */

          const splitName =
            splitChuinName(
              item.name
            );


          const mainRowTop =
            rowStarts[
              rowIndex
            ];


          const mainRowHeight =
            tableH *
            rowRatios[
              rowIndex
            ];


          const mainStartY =
            mainRowTop +
            mm(5);


          drawVerticalTextCentered(
            ctx,
            splitName.main,
            cx,
            mainRowTop,
            mainRowHeight,
            {
              size: mm(7.05),
              gap: mm(7.35),
              weight: "600"
            }
          );


          /*
            （三十五日）（四十九日）
          */

          if (
            splitName.sub
          ) {

            const subX =
              cx -
              columnW *
              0.24;


            const subY =
              mainStartY +
              mm(3.35);


            drawVerticalTextCentered(
              ctx,
              splitName.sub,
              cx - mm(4.0),
              mainRowTop,
              mainRowHeight,
              {
                size: mm(3.15),
                gap: mm(3.4),
                verticalParentheses: true
              }
            );

          }


          rowIndex++;


          /*
            日付
          */

          drawVerticalTextCentered(
            ctx,
            item.date,
            cx,
            rowStarts[rowIndex],
            tableH * rowRatios[rowIndex],
            {
              size: mm(6.35),
              gap: mm(6.7),
              dateSpacing: true,
              extraDateGap: mm(1.1)
            }
          );


          rowIndex++;


          /*
            十三仏
          */

          if (
            showThirteenBuddhas
          ) {

            const buddha =
              getThirteenBuddha(
                item.name
              );


            if (
              buddha
            ) {

              drawVerticalTextCentered(
                ctx,
                buddha,
                cx,
                rowStarts[rowIndex],
                tableH * rowRatios[rowIndex],
                {
                  size: mm(4.95),
                  gap: mm(5.2)
                }
              );

            }

          }

        }

      );


      /*
        中陰とは
      */

      setFont(
        ctx,
        mm(3.7),
        "600",
        "sans"
      );


      ctx.textAlign =
        "left";


      ctx.fillText(
        "中陰とは",
        mm(48),
        mm(160)
      );


      setFont(
        ctx,
        mm(2.75),
        "normal",
        "sans"
      );


      ctx.textAlign =
        "left";


      const descriptionLines = [

        "ご命日から四十九日までの期間を「中陰」といいます。",

        "この間、初七日から七七日（四十九日）まで、",

        "七日ごとに忌日を迎え、故人を偲びご供養を勤めます。"

      ];


      descriptionLines
        .forEach(

          function (
            line,
            index
          ) {

            ctx.fillText(
              line,
              mm(48),
              mm(
                168 +
                index *
                6.5
              )
            );

          }

        );


      drawIhaiCanvas(
        ctx
      );


      return canvas;

    }

        mm(24);

      const tableW =
        mm(213);

      const tableH =
        mm(108);


      const nenkai =
        [
          ...data.nenkai
        ].reverse();


      const count =
        nenkai.length;


      const columnW =
        tableW /
        count;


      const rowRatios =
        showThirteenBuddhas
          ? [0.35, 0.38, 0.27]
          : [0.44, 0.56];


      const rowStarts =
        [
          tableY
        ];


      let cumulative =
        0;


      for (
        let i = 0;
        i <
        rowRatios.length -
        1;
        i++
      ) {

        cumulative +=
          rowRatios[i];


        rowStarts.push(
          tableY +
          tableH *
          cumulative
        );

      }


      ctx.lineWidth =
        mm(0.18);


      ctx.strokeRect(
        tableX,
        tableY,
        tableW,
        tableH
      );


      ctx.beginPath();


      for (
        let i = 1;
        i < count;
        i++
      ) {

        const x =
          tableX +
          columnW *
          i;


        ctx.moveTo(
          x,
          tableY
        );


        ctx.lineTo(
          x,
          tableY +
          tableH
        );

      }


      rowStarts
        .slice(1)
        .forEach(

          function (
            y
          ) {

            ctx.moveTo(
              tableX,
              y
            );


            ctx.lineTo(
              tableX +
              tableW,
              y
            );

          }

        );


      ctx.stroke();


      nenkai.forEach(

        function (
          item,
          index
        ) {

          const cx =
            tableX +
            columnW *
            index +
            columnW /
            2;


          drawVerticalDistributed(
            ctx,
            item.name,
            cx,
            rowStarts[0],
            tableH * rowRatios[0],
            {
              size: mm(8.45),
              weight: "600"
            }
          );


          drawVerticalTextCentered(
            ctx,
            item.year,
            cx,
            rowStarts[1],
            tableH * rowRatios[1],
            {
              size: mm(6.35),
              gap: mm(6.6)
            }
          );


          if (
            showThirteenBuddhas
          ) {

            const buddha =
              getThirteenBuddha(
                item.name
              );


            if (
              buddha
            ) {

              drawVerticalTextCentered(
                ctx,
                buddha,
                cx,
                rowStarts[2],
                tableH * rowRatios[2],
                {
                  size: mm(4.95),
                  gap: mm(5.2)
                }
              );

            }

          }

        }

      );


      /*
        法事とは
        本文は後ほど曹洞宗資料等を確認して正式校正する。
      */

      setFont(
        ctx,
        mm(3.7),
        "600",
        "sans"
      );

      ctx.textAlign =
        "left";

      ctx.fillText(
        "法事とは",
        mm(81),
        mm(141)
      );


      setFont(
        ctx,
        mm(2.75),
        "normal",
        "sans"
      );

      ctx.fillText(
        "※説明文は、曹洞宗の資料等を確認のうえ後ほど正式に校正します。",
        mm(81),
        mm(150)
      );


      return canvas;

    }


    /*
      ========================================
      PDF保存
    ========================================
    */

    async function savePdf() {

      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "PDFを作成しています…";


      try {

        if (
          document.fonts &&
          document.fonts.ready
        ) {

          await document
            .fonts
            .ready;

        }


        if (
          !window.jspdf ||
          !window.jspdf.jsPDF
        ) {

          throw new Error(
            "jsPDFが読み込まれていません。"
          );

        }


        const front =
          renderFrontCanvas();


        const back =
          renderBackCanvas();


        const {
          jsPDF
        } =
          window.jspdf;


        const pdf =
          new jsPDF({

            orientation:
              "landscape",

            unit:
              "mm",

            format:
              "a4",

            compress:
              true

          });


        pdf.addImage(

          front.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        pdf.addPage(
          "a4",
          "landscape"
        );


        pdf.addImage(

          back.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        pdf.save(
          "中陰年回表.pdf"
        );


        status.textContent =
          "中陰年回表.pdf を作成しました。";

      }

      catch (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          "PDFを作成できませんでした。時間をおいてもう一度お試しください。";

      }

    }


    document
      .getElementById(
        "pdfSaveButton"
      )
      .addEventListener(
        "click",
        savePdf
      );


    if (
      data
    ) {

      buildPreview();

    }

  </script>
