<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>中陰年回表</title>


  <!-- PDF直接生成用 -->
  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      background: #ddd;
      color: #111;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
    }


    /* ========================================
       操作部分
    ======================================== */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 12px;

      background: #fff;

      border-bottom:
        1px solid #bbb;

      text-align: center;
    }


    .print-guide {
      margin-bottom: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 14px;
      line-height: 1.6;

      color: #555;
    }


    .toolbar-buttons {
      display: flex;
      justify-content: center;

      gap: 10px;
    }


    .toolbar button {
      padding:
        12px 22px;

      border: 0;
      border-radius: 6px;

      color: #fff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }


    .back-button {
      background: #777;
    }


    .pdf-button {
      background: #333;
    }


    .print-button {
      background: #555;
    }


    .status {
      min-height: 22px;

      margin-top: 8px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 13px;

      color: #666;
    }


    /* ========================================
       A4横プレビュー
       297 × 210mm
    ======================================== */

    .page {
      position: relative;

      width: 297mm;
      height: 210mm;

      margin:
        14mm auto;

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 2px 14px
        rgba(0,0,0,0.20);
    }


    /*
      画面確認用折り線
      PDF・印刷には出さない
    */

    .screen-fold {
      position: absolute;

      top: 0;
      bottom: 0;

      border-left:
        1px dashed #bbb;

      pointer-events: none;
    }


    .fold-1 {
      left: 99mm;
    }


    .fold-2 {
      left: 198mm;
    }


    .vertical {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;
    }


    /* ========================================
       表面：寺院情報
    ======================================== */

    .temple-info {
      position: absolute;

      left: 8mm;
      top: 17mm;

      width: 38mm;
      height: 176mm;

      display: flex;

      justify-content:
        center;

      gap: 5mm;
    }


    .temple-name {
      font-size:
        11pt;

      line-height:
        1.8;
    }


    .temple-address {
      font-size:
        7.4pt;

      line-height:
        1.8;
    }


    /* ========================================
       表面：中陰表
    ======================================== */

    .chuin-area {
      position: absolute;

      left: 48mm;
      top: 13mm;

      width: 143mm;
      height: 184mm;
    }


    .chuin-title {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 19pt;
      font-weight: 600;

      letter-spacing:
        0.18em;
    }


    .chuin-table {
      position: absolute;

      left: 0;
      top: 24mm;

      width: 100%;
      height: 111mm;

      border:
        1px solid #333;

      display: grid;

      grid-template-columns:
        repeat(8, 1fr);
    }


    .chuin-column {
      border-right:
        1px solid #777;

      display: grid;
    }


    .chuin-column:last-child {
      border-right: 0;
    }


    .chuin-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom:
        1px solid #999;

      overflow: hidden;
    }


    .chuin-cell:last-child {
      border-bottom: 0;
    }


    .chuin-name {
      writing-mode:
        vertical-rl;

      text-orientation:
        mixed;

      font-size: 9.5pt;
      font-weight: 600;

      line-height: 1.25;

      text-align: center;
    }


    .old-name {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 7.2pt;

      color: #555;
    }


    .chuin-date {
      writing-mode:
        vertical-rl;

      text-orientation:
        mixed;

      font-size: 8.7pt;

      white-space: nowrap;
    }


    .thirteen-buddha {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 7.5pt;

      color: #333;
    }


    /* ========================================
       中陰とは
    ======================================== */

    .chuin-description {
      position: absolute;

      left: 2mm;
      right: 2mm;

      top: 143mm;

      min-height: 32mm;

      padding:
        5mm 6mm;

      border-top:
        1px solid #aaa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 8.5pt;
      line-height: 1.7;
    }


    .chuin-description strong {
      display: block;

      margin-bottom: 2mm;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 10pt;
    }


    /* ========================================
       位牌
       右側99mm以内
    ======================================== */

    .ihai-area {
      position: absolute;

      left: 201mm;
      top: 10mm;

      width: 86mm;
      height: 190mm;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .ihai {
      position: relative;

      width: 60mm;
      height: 165mm;
    }


    .ihai-body {
      position: absolute;

      left: 7mm;
      right: 7mm;

      top: 20mm;
      bottom: 20mm;

      border:
        1.3px solid #222;

      border-radius:
        7mm 7mm 3mm 3mm;
    }


    .ihai-top {
      position: absolute;

      top: 3mm;
      left: 18mm;

      width: 24mm;
      height: 27mm;

      border-top:
        1.3px solid #222;

      border-left:
        1.3px solid #222;

      border-right:
        1.3px solid #222;

      transform:
        rotate(45deg);
    }


    .ihai-base-1 {
      position: absolute;

      bottom: 14mm;
      left: 4mm;

      width: 52mm;

      border-top:
        1.3px solid #222;
    }


    .ihai-base-2 {
      position: absolute;

      bottom: 9mm;
      left: 9mm;

      width: 42mm;

      border-top:
        1.3px solid #222;
    }


    .ihai-main {
      position: absolute;

      top: 33mm;
      right: 20mm;

      height: 100mm;

      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 16pt;

      letter-spacing:
        0.08em;
    }


    .ihai-date {
      position: absolute;

      top: 40mm;
      right: 8mm;

      height: 95mm;

      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 9pt;
    }


    .ihai-left {
      position: absolute;

      top: 40mm;
      left: 8mm;

      height: 100mm;

      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 8.5pt;

      line-height: 1.7;
    }


    /* ========================================
       裏面
    ======================================== */

    .back-extra {
      position: absolute;

      left: 12mm;
      top: 20mm;

      width: 70mm;
      height: 170mm;
    }


    .nenkai-area {
      position: absolute;

      left: 83mm;
      top: 14mm;

      width: 202mm;
      height: 180mm;
    }


    .nenkai-title {
      width: 100%;

      text-align: center;

      font-size: 19pt;
      font-weight: 600;

      letter-spacing:
        0.18em;
    }


    .nenkai-table {
      position: absolute;

      left: 0;
      top: 25mm;

      width: 100%;
      height: 110mm;

      border:
        1px solid #333;

      display: grid;

      grid-template-columns:
        repeat(10, 1fr);
    }


    .nenkai-column {
      display: grid;

      border-right:
        1px solid #777;
    }


    .nenkai-column:last-child {
      border-right: 0;
    }


    .nenkai-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom:
        1px solid #999;

      overflow: hidden;
    }


    .nenkai-cell:last-child {
      border-bottom: 0;
    }


    .nenkai-name {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 8.5pt;

      font-weight: 600;
    }


    .nenkai-year {
      writing-mode:
        vertical-rl;

      text-orientation:
        mixed;

      font-size: 9pt;
    }


    .nenkai-buddha {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size: 7.5pt;

      color: #333;
    }


    /* ========================================
       印刷
    ======================================== */

    @page {
      size: A4 landscape;
      margin: 0;
    }


    @media print {

      html,
      body {
        background: #fff;
      }


      .toolbar {
        display: none;
      }


      .page {
        width: 297mm;
        height: 210mm;

        margin: 0;

        box-shadow: none;

        page-break-after:
          always;
      }


      .page:last-child {
        page-break-after:
          auto;
      }


      .screen-fold {
        display: none;
      }

    }


    @media
    screen and
    (max-width: 900px) {

      .page-wrapper {
        width: 297mm;

        transform-origin:
          top left;

        transform:
          scale(0.42);

        margin-bottom:
          -115mm;
      }

    }


    @media
    screen and
    (max-width: 600px) {

      .toolbar-buttons {
        flex-direction:
          column;
      }


      .toolbar button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       操作
  ======================================== -->

  <div class="toolbar">


    <div class="print-guide">

      「PDFを保存」はPDFファイルを直接保存します。<br>

      「印刷する」はプリンターの印刷画面を開きます。

    </div>


    <div class="toolbar-buttons">


      <button
        type="button"
        class="back-button"
        onclick="history.back()"
      >
        戻る
      </button>


      <button
        type="button"
        class="pdf-button"
        id="pdfSaveButton"
      >
        PDFを保存
      </button>


      <button
        type="button"
        class="print-button"
        onclick="window.print()"
      >
        印刷する
      </button>


    </div>


    <div
      class="status"
      id="status"
    ></div>


  </div>


  <div class="page-wrapper">


    <!-- ========================================
         表面
    ======================================== -->

    <section class="page front">


      <div
        class="screen-fold fold-1"
      ></div>

      <div
        class="screen-fold fold-2"
      ></div>


      <!-- 寺院情報 -->

      <div class="temple-info">


        <div
          class="temple-name vertical"
        ></div>


        <div
          class="temple-address vertical"
        ></div>


      </div>


      <!-- 中陰表 -->

      <div class="chuin-area">


        <div class="chuin-title">
          中　陰　表
        </div>


        <div
          class="chuin-table"
          id="chuinTable"
        ></div>


        <div class="chuin-description">


          <strong>
            中陰とは
          </strong>


          ご命日から四十九日までの期間を「中陰」といいます。<br>

          この間、初七日から七七日（四十九日）まで、
          七日ごとに忌日を迎え、故人を偲びご供養を勤めます。


        </div>


      </div>


      <!-- 位牌 -->

      <div class="ihai-area">


        <div class="ihai">


          <div class="ihai-top"></div>

          <div class="ihai-body"></div>

          <div class="ihai-base-1"></div>

          <div class="ihai-base-2"></div>


          <div
            class="ihai-date"
            id="ihaiDate"
          ></div>


          <div
            class="ihai-main"
            id="ihaiMain"
          ></div>


          <div
            class="ihai-left"
            id="ihaiLeft"
          ></div>


        </div>


      </div>


    </section>



    <!-- ========================================
         裏面
    ======================================== -->

    <section class="page back">


      <div
        class="screen-fold fold-1"
      ></div>

      <div
        class="screen-fold fold-2"
      ></div>


      <div class="back-extra">
      </div>


      <div class="nenkai-area">


        <div class="nenkai-title">
          年　回　表
        </div>


        <div
          class="nenkai-table"
          id="nenkaiTable"
        ></div>


      </div>


    </section>


  </div>


  <script>

    "use strict";


    /*
      ========================================
      データ取得
    ========================================
    */

    const stored =
      sessionStorage.getItem(
        "zenshojiPdfData"
      );


    if (!stored) {

      alert(
        "印刷用の情報がありません。"
      );

      window.location.href =
        "memorial.html";

    }


    const data =
      stored
        ? JSON.parse(
            stored
          )
        : null;


    /*
      ========================================
      PDF表示設定
    ========================================
    */

    const pdfOptions =
      data &&
      data.options
        ? data.options
        : {};


    const showOldNames =
      pdfOptions.showOldNames !== false;


    const showThirteenBuddhas =
      pdfOptions.showThirteenBuddhas === true;


    const showTempleInfo =
      pdfOptions.showTempleInfo !== false;


    /*
      ========================================
      十三仏
    ========================================
    */

    const thirteenBuddhas = {


      "初七日":
        "不動明王",


      "二七日":
        "釈迦如来",


      "三七日":
        "文殊菩薩",


      "四七日":
        "普賢菩薩",


      "五七日（三十五日）":
        "地蔵菩薩",


      "六七日":
        "弥勒菩薩",


      "七七日（四十九日）":
        "薬師如来",


      "百か日":
        "観世音菩薩",


      "一周忌":
        "勢至菩薩",


      "三回忌":
        "阿弥陀如来",


      "七回忌":
        "阿閦如来",


      "十三回忌":
        "大日如来",


      "三十三回忌":
        "虚空蔵菩薩"


    };


    function getThirteenBuddha(
      name
    ) {


      return (
        thirteenBuddhas[
          name
        ] || ""
      );


    }


    /*
      ========================================
      漢数字
      位牌のみ
    ========================================
    */

    function numberToKanji(
      n
    ) {


      const digits = [

        "",

        "一",

        "二",

        "三",

        "四",

        "五",

        "六",

        "七",

        "八",

        "九"

      ];


      n =
        Number(n);


      if (
        n < 10
      ) {

        return (
          digits[n]
        );

      }


      if (
        n === 10
      ) {

        return "十";

      }


      if (
        n < 20
      ) {


        return (

          "十" +

          digits[
            n - 10
          ]

        );


      }


      if (
        n < 100
      ) {


        const tens =
          Math.floor(
            n / 10
          );


        const ones =
          n % 10;


        return (

          digits[tens] +

          "十" +

          digits[ones]

        );


      }


      if (
        n < 1000
      ) {


        const hundreds =
          Math.floor(
            n / 100
          );


        const remainder =
          n % 100;


        let result =
          "";


        result +=

          hundreds === 1

            ? "百"

            : digits[hundreds] +
              "百";


        if (
          remainder
        ) {


          result +=
            numberToKanji(
              remainder
            );


        }


        return result;


      }


      return String(n);


    }


    function japaneseDateToKanji(
      text
    ) {


      const match =
        String(text)
          .match(

            /^(大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日$/

          );


      if (
        !match
      ) {

        return text;

      }


      const era =
        match[1];


      const year =
        match[2] === "元"

          ? "元"

          : numberToKanji(
              Number(
                match[2]
              )
            );


      const month =
        numberToKanji(
          Number(
            match[3]
          )
        );


      const day =
        numberToKanji(
          Number(
            match[4]
          )
        );


      return (

        era +

        year +

        "年" +

        month +

        "月" +

        day +

        "日"

      );


    }


    function ageToKanji(
      age
    ) {


      if (
        !age
      ) {

        return "";

      }


      return (

        numberToKanji(
          Number(age)
        ) +

        "歳"

      );


    }


    /*
      ========================================
      HTMLエスケープ
    ========================================
    */

    function escapeHtml(
      text
    ) {


      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );


    }


    /*
      ========================================
      中陰表の段構成
    ========================================
    */

    function getChuinGridRows() {


      /*
        旧呼称＋十三仏
      */

      if (
        showOldNames &&
        showThirteenBuddhas
      ) {


        return (
          "17% 29% 34% 20%"
        );


      }


      /*
        旧呼称のみ
      */

      if (
        showOldNames
      ) {


        return (
          "22% 33% 45%"
        );


      }


      /*
        十三仏のみ
      */

      if (
        showThirteenBuddhas
      ) {


        return (
          "31% 43% 26%"
        );


      }


      /*
        忌日＋日付
      */

      return (
        "42% 58%"
      );


    }


    /*
      ========================================
      年回表の段構成
    ========================================
    */

    function getNenkaiGridRows() {


      if (
        showThirteenBuddhas
      ) {


        return (
          "36% 40% 24%"
        );


      }


      return (
        "46% 54%"
      );


    }


    /*
      ========================================
      HTMLプレビュー
    ========================================
    */

    function buildPreview() {


      /*
        寺院情報
      */

      const templeInfo =
        document.querySelector(
          ".temple-info"
        );


      if (
        showTempleInfo
      ) {


        templeInfo.style.display =
          "flex";


        document
          .querySelector(
            ".temple-name"
          )
          .textContent =
          data.temple.name;


        document
          .querySelector(
            ".temple-address"
          )
          .textContent =

          data.temple.postal +

          "　" +

          data.temple.address +

          "　電話" +

          data.temple.tel;


      }


      else {


        templeInfo.style.display =
          "none";


      }


      /*
        位牌
      */

      document
        .getElementById(
          "ihaiDate"
        )
        .textContent =
        japaneseDateToKanji(
          data.deathDateJapanese
        );


      const ihaiMain =
        document.getElementById(
          "ihaiMain"
        );


      const ihaiLeft =
        document.getElementById(
          "ihaiLeft"
        );


      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {


        ihaiMain.textContent =
          data.kaimyo.trim();


        let text =
          "";


        if (
          data.name &&
          data.name.trim()
        ) {


          text +=

            "俗名　" +

            data.name.trim();


        }


        if (
          data.age &&
          String(
            data.age
          ).trim()
        ) {


          if (
            text
          ) {

            text +=
              "　";

          }


          text +=

            "行年　" +

            ageToKanji(
              data.age
            );


        }


        ihaiLeft.textContent =
          text;


      }


      else {


        const name =
          data.name
            ? data.name.trim()
            : "";


        ihaiMain.innerHTML = `

          <span
            style="
              font-size:0.58em;
            "
          >
            俗名
          </span>

          <span
            style="
              font-size:1.15em;
            "
          >
            ${escapeHtml(name)}
          </span>

          <span
            style="
              font-size:0.58em;
            "
          >
            之精霊位
          </span>

        `;


        if (
          data.age
        ) {


          ihaiLeft.textContent =

            "行年　" +

            ageToKanji(
              data.age
            );


        }


        else {


          ihaiLeft.textContent =
            "";


        }


      }


      /*
        中陰表
      */

      const chuinTable =
        document.getElementById(
          "chuinTable"
        );


      chuinTable.innerHTML =
        "";


      [
        ...data.chuin
      ]
        .reverse()
        .forEach(

          function (
            item
          ) {


            const column =
              document.createElement(
                "div"
              );


            column.className =
              "chuin-column";


            column.style
              .gridTemplateRows =
              getChuinGridRows();


            let html =
              "";


            /*
              旧呼称
            */

            if (
              showOldNames
            ) {


              html += `

                <div
                  class="chuin-cell"
                >

                  <div
                    class="old-name"
                  >
                    ${escapeHtml(
                      item.oldName || ""
                    )}

    /*
      ========================================
      Canvas設定
    ========================================
    */

    const PDF_SCALE =
      10;


    const PAGE_W_MM =
      297;


    const PAGE_H_MM =
      210;


    function mm(
      value
    ) {


      return (
        value *
        PDF_SCALE
      );


    }


    function createPageCanvas() {


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        mm(
          PAGE_W_MM
        );


      canvas.height =
        mm(
          PAGE_H_MM
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#111111";


      ctx.strokeStyle =
        "#222222";


      return {

        canvas,

        ctx

      };


    }


    function setFont(
      ctx,
      sizePx,
      weight = "normal",
      family = "serif"
    ) {


      const families =

        family === "sans"

          ? '"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif'

          : '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif';


      ctx.font =

        weight +

        " " +

        sizePx +

        "px " +

        families;


      ctx.textBaseline =
        "top";


    }


    /*
      ========================================
      縦書き用文字分解

      𠮷などを1文字として保持する
    ========================================
    */

    function tokenizeVerticalText(
      text
    ) {


      const characters =
        Array.from(
          String(text)
        );


      const tokens =
        [];


      let numberBuffer =
        "";


      characters.forEach(

        function (
          char
        ) {


          if (
            /^[0-9]$/.test(
              char
            )
          ) {


            numberBuffer +=
              char;


            return;


          }


          if (
            numberBuffer
          ) {


            tokens.push(
              numberBuffer
            );


            numberBuffer =
              "";


          }


          tokens.push(
            char
          );


        }

      );


      if (
        numberBuffer
      ) {


        tokens.push(
          numberBuffer
        );


      }


      return tokens;


    }


    /*
      ========================================
      日本語縦書き描画

      ・1～2桁数字＝縦中横
      ・3桁以上＝1桁ずつ
      ・括弧＝縦組み
      ・ハイフン＝縦棒
    ========================================
    */

    function drawVerticalText(
      ctx,
      text,
      x,
      y,
      options = {}
    ) {


      const size =
        options.size ||
        mm(3.5);


      const gap =
        options.gap ||
        size *
        1.08;


      const maxHeight =
        options.maxHeight ||
        Infinity;


      const weight =
        options.weight ||
        "normal";


      const family =
        options.family ||
        "serif";


      setFont(
        ctx,
        size,
        weight,
        family
      );


      const tokens =
        tokenizeVerticalText(
          text
        );


      let yy =
        y;


      for (
        const token of tokens
      ) {


        if (
          yy -
          y +
          gap >
          maxHeight
        ) {

          break;

        }


        /*
          1～2桁数字
        */

        if (
          /^\d+$/.test(
            token
          ) &&
          token.length <=
          2
        ) {


          ctx.save();


          setFont(

            ctx,

            size *
            0.90,

            weight,

            family

          );


          const metrics =
            ctx.measureText(
              token
            );


          const maximumWidth =
            size *
            0.95;


          let scaleX =
            1;


          if (
            metrics.width >
            maximumWidth
          ) {


            scaleX =

              maximumWidth /

              metrics.width;


          }


          ctx.translate(

            x,

            yy +
            size *
            0.48

          );


          ctx.scale(
            scaleX,
            1
          );


          ctx.textAlign =
            "center";


          ctx.textBaseline =
            "middle";


          ctx.fillText(
            token,
            0,
            0
          );


          ctx.restore();


          yy +=
            gap;


          continue;


        }


        /*
          3桁以上
        */

        if (
          /^\d+$/.test(
            token
          )
        ) {


          for (
            const digit of token
          ) {


            if (
              yy -
              y +
              gap >
              maxHeight
            ) {

              break;

            }


            setFont(

              ctx,

              size,

              weight,

              family

            );


            const metrics =
              ctx.measureText(
                digit
              );


            ctx.fillText(

              digit,

              x -
              metrics.width /
              2,

              yy

            );


            yy +=
              gap;


          }


          continue;


        }


        /*
          括弧
        */

        if (
          token === "(" ||
          token === "（" ||
          token === ")" ||
          token === "）"
        ) {


          ctx.save();


          ctx.translate(

            x,

            yy +
            size /
            2

          );


          ctx.rotate(
            Math.PI /
            2
          );


          ctx.textAlign =
            "center";


          ctx.textBaseline =
            "middle";


          ctx.fillText(

            token === "(" ||
            token === "（"

              ? "（"

              : "）",

            0,
            0

          );


          ctx.restore();


          yy +=
            gap;


          continue;


        }


        /*
          ハイフン等
        */

        if (

          token === "-" ||

          token === "－" ||

          token === "ー" ||

          token === "―" ||

          token === "‐" ||

          token === "–" ||

          token === "—"

        ) {


          ctx.save();


          ctx.beginPath();


          ctx.lineWidth =
            Math.max(

              1,

              size *
              0.07

            );


          ctx.moveTo(

            x,

            yy +
            size *
            0.15

          );


          ctx.lineTo(

            x,

            yy +
            size *
            0.85

          );


          ctx.stroke();


          ctx.restore();


          yy +=
            gap;


          continue;


        }


        /*
          通常文字
        */

        setFont(

          ctx,

          size,

          weight,

          family

        );


        const metrics =
          ctx.measureText(
            token
          );


        ctx.fillText(

          token,

          x -
          metrics.width /
          2,

          yy

        );


        yy +=
          gap;


      }


    }


    function drawCenteredText(
      ctx,
      text,
      centerX,
      y,
      size,
      weight = "normal",
      family = "serif"
    ) {


      setFont(
        ctx,
        size,
        weight,
        family
      );


      const width =
        ctx.measureText(
          text
        ).width;


      ctx.fillText(

        text,

        centerX -
        width /
        2,

        y

      );


    }


    /*
      ========================================
      位牌PDF描画
    ========================================
    */

    function drawIhaiCanvas(
      ctx
    ) {


      const left =
        mm(214);


      const top =
        mm(24);


      const width =
        mm(60);


      const height =
        mm(162);


      ctx.lineWidth =
        mm(0.25);


      ctx.strokeRect(

        left +
        mm(7),

        top +
        mm(19),

        width -
        mm(14),

        height -
        mm(39)

      );


      /*
        上部
      */

      ctx.beginPath();


      ctx.moveTo(

        left +
        mm(18),

        top +
        mm(19)

      );


      ctx.lineTo(

        left +
        width /
        2,

        top +
        mm(5)

      );


      ctx.lineTo(

        left +
        width -
        mm(18),

        top +
        mm(19)

      );


      ctx.stroke();


      /*
        台座
      */

      ctx.beginPath();


      ctx.moveTo(

        left +
        mm(4),

        top +
        height -
        mm(15)

      );


      ctx.lineTo(

        left +
        width -
        mm(4),

        top +
        height -
        mm(15)

      );


      ctx.moveTo(

        left +
        mm(10),

        top +
        height -
        mm(9)

      );


      ctx.lineTo(

        left +
        width -
        mm(10),

        top +
        height -
        mm(9)

      );


      ctx.stroke();


      /*
        命日
      */

      drawVerticalText(

        ctx,

        japaneseDateToKanji(
          data.deathDateJapanese
        ),

        left +
        width -
        mm(10),

        top +
        mm(34),

        {

          size:
            mm(3.0),

          gap:
            mm(3.4),

          maxHeight:
            mm(100)

        }

      );


      /*
        戒名あり
      */

      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {


        drawVerticalText(

          ctx,

          data.kaimyo.trim(),

          left +
          width /
          2,

          top +
          mm(29),

          {

            size:
              mm(5.0),

            gap:
              mm(5.6),

            maxHeight:
              mm(105),

            weight:
              "600"

          }

        );


        let leftText =
          "";


        if (
          data.name &&
          data.name.trim()
        ) {


          leftText +=

            "俗名" +

            data.name.trim();


        }


        if (
          data.age
        ) {


          if (
            leftText
          ) {


            leftText +=
              "　";


          }


          leftText +=

            "行年" +

            ageToKanji(
              data.age
            );


        }


        if (
          leftText
        ) {


          drawVerticalText(

            ctx,

            leftText,

            left +
            mm(10),

            top +
            mm(34),

            {

              size:
                mm(2.8),

              gap:
                mm(3.2),

              maxHeight:
                mm(100)

            }

          );


        }


      }


      /*
        戒名なし
      */

      else {


        const name =
          data.name
            ? data.name.trim()
            : "";


        const cx =
          left +
          width /
          2;


        let y =
          top +
          mm(31);


        drawVerticalText(

          ctx,

          "俗名",

          cx,

          y,

          {

            size:
              mm(3.0),

            gap:
              mm(3.4)

          }

        );


        y +=
          mm(12);


        drawVerticalText(

          ctx,

          name,

          cx,

          y,

          {

            size:
              mm(5.1),

            gap:
              mm(5.7),

            weight:
              "600"

          }

        );


        y +=

          mm(

            Math.max(

              18,

              Array.from(
                name
              ).length *
              6

            )

          );


        drawVerticalText(

          ctx,

          "之精霊位",

          cx,

          y,

          {

            size:
              mm(3.0),

            gap:
              mm(3.4)

          }

        );


        if (
          data.age
        ) {


          drawVerticalText(

            ctx,

            "行年" +
            ageToKanji(
              data.age
            ),

            left +
            mm(10),

            top +
            mm(40),

            {

              size:
                mm(2.8),

              gap:
                mm(3.2)

            }

          );


        }


      }


    }

    function renderFrontCanvas() {


      const {

        canvas,

        ctx

      } =

      /*

      */

      if (
        showTempleInfo
      ) {


        drawVerticalText(

          mm(34),

          mm(24),

          {

            size:
              mm(3.5),

            gap:
              mm(4.2),

            maxHeight:
              mm(140)

          }

        );


        drawVerticalText(

          ctx,

          data.temple.postal +
          data.temple.address +
          "電話" +
          data.temple.tel,

          mm(20),

          mm(24),

          {

            size:
              mm(2.4),

            gap:
              mm(3.0),

            maxHeight:
              mm(155),

            family:
              "sans"

          }

        );


      }


      /*
        タイトル
      */

      drawCenteredText(

        ctx,

        "中　陰　表",

        mm(119.5),

        mm(14),

        mm(6.5),

        "600"

      );


      /*
        表
      */

      const tableX =
        mm(48);


      const tableY =
        mm(37);


      const tableW =
        mm(143);


      const tableH =
        mm(111);


      const columnCount =
        8;


      const columnW =
        tableW /
        columnCount;


      ctx.lineWidth =
        mm(0.18);


      ctx.strokeRect(

        tableX,

        tableY,

        tableW,

        tableH

      );


      /*
        段比率
      */

      let rowRatios;


      if (
        showOldNames &&
        showThirteenBuddhas
      ) {


        rowRatios =
          [
            0.17,
            0.29,
            0.34,
            0.20
          ];


      }


      else if (
        showOldNames
      ) {


        rowRatios =
          [
            0.22,
            0.33,
            0.45
          ];


      }


      else if (
        showThirteenBuddhas
      ) {


        rowRatios =
          [
            0.31,
            0.43,
            0.26
          ];


      }


      else {


        rowRatios =
          [
            0.42,
            0.58
          ];


      }


      /*
        横罫線位置
      */

      const rowStarts =
        [
          tableY
        ];


      let cumulative =
        0;


      for (
        let i = 0;
        i < rowRatios.length - 1;
        i++
      ) {


        cumulative +=
          rowRatios[i];


        rowStarts.push(

          tableY +
          tableH *
          cumulative

        );


      }


      /*
        罫線
      */

      ctx.beginPath();


      for (
        let i = 1;
        i < columnCount;
        i++
      ) {


        const x =

          tableX +

          columnW *
          i;


        ctx.moveTo(
          x,
          tableY
        );


        ctx.lineTo(
          x,
          tableY +
          tableH
        );


      }


      rowStarts
        .slice(1)
        .forEach(

          function (
            y
          ) {


            ctx.moveTo(
              tableX,
              y
            );


            ctx.lineTo(
              tableX +
              tableW,
              y
            );


          }

        );


      ctx.stroke();


      const chuin =
        [
          ...data.chuin
        ].reverse();


      chuin.forEach(

        function (
          item,
          index
        ) {


          const cx =

            tableX +

            columnW *
            index +

            columnW /
            2;


          let rowIndex =
            0;


          /*
            旧呼称
          */

          if (
            showOldNames
          ) {


            if (
              item.oldName
            ) {


              drawVerticalText(

                ctx,

                item.oldName,

                cx,

                rowStarts[
                  rowIndex
                ] +
                mm(3),

                {

                  size:
                    mm(2.4),

                  gap:
                    mm(2.8),

                  maxHeight:

                    tableH *

                    rowRatios[
                      rowIndex
                    ] -

                    mm(5)

                }

              );


            }


            rowIndex++;


          }


          /*
            忌日
          */

          drawVerticalText(

            ctx,

            item.name,

            cx,

            rowStarts[
              rowIndex
            ] +
            mm(4),

            {

              size:
                mm(3.0),

              gap:
                mm(3.35),

              maxHeight:

                tableH *

                rowRatios[
                  rowIndex
                ] -

                mm(7),

              weight:
                "600"

            }

          );


          rowIndex++;


          /*
            日付
          */

          drawVerticalText(

            ctx,

            item.date,

            cx,

            rowStarts[
              rowIndex
            ] +
            mm(4),

            {

              size:
                mm(2.75),

              gap:
                mm(3.1),

              maxHeight:

                tableH *

                rowRatios[
                  rowIndex
                ] -

                mm(7)

            }

          );


          rowIndex++;


          /*
            十三仏
          */

          if (
            showThirteenBuddhas
          ) {


            const buddha =
              getThirteenBuddha(
                item.name
              );


            if (
              buddha
            ) {


              drawVerticalText(

                ctx,

                buddha,

                cx,

                rowStarts[
                  rowIndex
                ] +
                mm(3),

                {

                  size:
                    mm(2.45),

                  gap:
                    mm(2.85),

                  maxHeight:

                    tableH *

                    rowRatios[
                      rowIndex
                    ] -

                    mm(5)

                }

              );


            }


          }


        }

      );


      /*
        中陰とは
      */

      setFont(

        ctx,

        mm(3.3),

        "600",

        "sans"

      );


      ctx.fillText(

        "中陰とは",

        mm(51),

        mm(158)

      );


      setFont(

        ctx,

        mm(2.5),

        "normal",

        "sans"

      );


      const descriptionLines = [

        "ご命日から四十九日までの期間を「中陰」といいます。",

        "この間、初七日から七七日（四十九日）まで、",

        "七日ごとに忌日を迎え、故人を偲びご供養を勤めます。"

      ];


      descriptionLines
        .forEach(

          function (
            line,
            index
          ) {


            ctx.fillText(

              line,

              mm(51),

              mm(
                166 +
                index *
                6
              )

            );


          }

        );


      drawIhaiCanvas(
        ctx
      );


      return canvas;


    }

                mm(3.0),

              gap:
                mm(3.4),

              maxHeight:

                tableH *

                rowRatios[1] -

                mm(10)

            }

          );


          /*
            十三仏
          */

          if (
            showThirteenBuddhas
          ) {


            const buddha =
              getThirteenBuddha(
                item.name
              );


            if (
              buddha
            ) {


              drawVerticalText(

                ctx,

                buddha,

                cx,

                rowStarts[2] +
                mm(4),

                {

                  size:
                    mm(2.5),

                  gap:
                    mm(2.9),

                  maxHeight:

                    tableH *

                    rowRatios[2] -

                    mm(6)

                }

              );


            }


          }


        }

      );


      return canvas;


    }


    /*
      ========================================
      PDF直接保存
    ========================================
    */

    async function savePdf() {


      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "PDFを作成しています…";


      try {


        if (
          document.fonts &&
          document.fonts.ready
        ) {


          await document
            .fonts
            .ready;


        }


        if (
          !window.jspdf ||
          !window.jspdf.jsPDF
        ) {


          throw new Error(
            "jsPDFが読み込まれていません。"
          );


        }


        const front =
          renderFrontCanvas();


        const back =
          renderBackCanvas();


        const {
          jsPDF
        } =
          window.jspdf;


        const pdf =
          new jsPDF({

            orientation:
              "landscape",

            unit:
              "mm",

            format:
              "a4",

            compress:
              true

          });


        /*
          表面
        */

        pdf.addImage(

          front.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        /*
          裏面
        */

        pdf.addPage(
          "a4",
          "landscape"
        );


        pdf.addImage(

          back.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        pdf.save(
          "中陰年回表.pdf"
        );


        status.textContent =
          "中陰年回表.pdf を作成しました。";


      }


      catch (
        error
      ) {


        console.error(
          error
        );


        status.textContent =
          "PDFを作成できませんでした。時間をおいてもう一度お試しください。";


      }


    }


    document
      .getElementById(
        "pdfSaveButton"
      )
      .addEventListener(

        "click",

        savePdf

      );


    /*
      ========================================
      開始
    ========================================
    */

    if (
      data
    ) {


      buildPreview();


    }

  </script>


</body>
