<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>中陰年回表</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ddd;
      color: #111;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
    }


    /* ========================================
       操作部分
    ======================================== */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 12px;

      background: #fff;
      border-bottom: 1px solid #bbb;

      text-align: center;
    }

    .print-guide {
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .toolbar-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .toolbar button {
      padding: 12px 24px;

      border: 0;
      border-radius: 6px;

      background: #333;
      color: #fff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .toolbar .back-button {
      background: #777;
    }


    /* ========================================
       A4横
       297mm × 210mm
    ======================================== */

    .page {
      position: relative;

      width: 297mm;
      height: 210mm;

      margin: 14mm auto;

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 2px 14px rgba(0,0,0,0.20);
    }


    /*
      画面確認用の三つ折り線
      印刷時には消す
    */

    .screen-fold {
      position: absolute;

      top: 0;
      bottom: 0;

      border-left: 1px dashed #bbb;

      pointer-events: none;
    }

    .fold-1 {
      left: 99mm;
    }

    .fold-2 {
      left: 198mm;
    }


    /* ========================================
       共通
    ======================================== */

    .vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }


    /* ========================================
       表面
    ======================================== */

    .front {
      position: relative;
    }


    /*
      左端：寺院情報
    */

    .temple-info {
      position: absolute;

      left: 10mm;
      top: 20mm;

      width: 37mm;
      height: 170mm;

      display: flex;
      justify-content: center;
      gap: 5mm;
    }

    .temple-name {
      font-size: 11pt;
      line-height: 1.8;
    }

    .temple-address {
      font-size: 7.7pt;
      line-height: 1.7;
    }


    /*
      中央〜左：中陰表
    */

    .chuin-area {
      position: absolute;

      left: 48mm;
      top: 13mm;

      width: 143mm;
      height: 184mm;
    }

    .chuin-title {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 19pt;
      font-weight: 600;
      letter-spacing: 0.18em;
    }


    .chuin-table {
      position: absolute;

      left: 0;
      top: 24mm;

      width: 100%;
      height: 111mm;

      border: 1px solid #333;

      display: grid;

      /*
        左 → 右

        百か日
        七七日
        六七日
        五七日
        四七日
        三七日
        二七日
        初七日

        縦書きでは右側から
        初七日 → 左へ進む
      */

      grid-template-columns:
        repeat(8, 1fr);
    }


    .chuin-column {
      position: relative;

      border-right: 1px solid #777;

      display: grid;

      grid-template-rows:
        36% 25% 39%;
    }

    .chuin-column:last-child {
      border-right: 0;
    }


    .chuin-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #999;

      overflow: hidden;
    }

    .chuin-cell:last-child {
      border-bottom: 0;
    }


    .chuin-name {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 9pt;
      line-height: 1.25;

      text-align: center;
    }


    .old-name {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 7.5pt;

      color: #444;
    }


    .chuin-date {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 8.5pt;

      white-space: nowrap;
    }


    /*
      中陰とは
    */

    .chuin-description {
      position: absolute;

      left: 2mm;
      right: 2mm;

      top: 143mm;

      min-height: 32mm;

      padding: 5mm 6mm;

      border-top: 1px solid #aaa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size: 8.5pt;
      line-height: 1.7;
    }

    .chuin-description strong {
      display: block;
      margin-bottom: 2mm;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 10pt;
    }


    /*
      右端：位牌
      三つ折り右面99mm内に完全収納
    */

    .ihai-area {
      position: absolute;

      left: 201mm;
      top: 10mm;

      width: 86mm;
      height: 190mm;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .ihai {
      position: relative;

      width: 60mm;
      height: 165mm;
    }


    /*
      位牌外形
    */

    .ihai-body {
      position: absolute;

      left: 7mm;
      right: 7mm;

      top: 20mm;
      bottom: 20mm;

      border: 1.3px solid #222;

      border-radius:
        7mm 7mm 3mm 3mm;
    }


    .ihai-top {
      position: absolute;

      top: 3mm;
      left: 18mm;

      width: 24mm;
      height: 27mm;

      border-top: 1.3px solid #222;
      border-left: 1.3px solid #222;
      border-right: 1.3px solid #222;

      transform: rotate(45deg);

      border-radius: 3mm 0 0 0;
    }


    .ihai-base-1 {
      position: absolute;

      bottom: 14mm;
      left: 4mm;

      width: 52mm;

      border-top: 1.3px solid #222;
    }


    .ihai-base-2 {
      position: absolute;

      bottom: 9mm;
      left: 9mm;

      width: 42mm;

      border-top: 1.3px solid #222;
    }


    /*
      位牌内文字
    */

    .ihai-main {
      position: absolute;

      top: 33mm;
      right: 20mm;

      height: 100mm;

      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 16pt;
      letter-spacing: 0.08em;
    }


    .ihai-date {
      position: absolute;

      top: 40mm;
      right: 8mm;

      height: 95mm;

      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 9pt;
    }


    .ihai-left {
      position: absolute;

      top: 40mm;
      left: 8mm;

      height: 100mm;

      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 8.5pt;

      line-height: 1.7;
    }


    /* ========================================
       裏面
    ======================================== */

    .back {
      position: relative;
    }


    /*
      左側
      初期版は余白
    */

    .back-extra {
      position: absolute;

      left: 12mm;
      top: 20mm;

      width: 70mm;
      height: 170mm;
    }


    /*
      右〜中央：年回表
    */

    .nenkai-area {
      position: absolute;

      left: 83mm;
      top: 14mm;

      width: 202mm;
      height: 180mm;
    }


    .nenkai-title {
      width: 100%;

      text-align: center;

      font-size: 19pt;
      font-weight: 600;
      letter-spacing: 0.18em;
    }


    .nenkai-table {
      position: absolute;

      left: 0;
      top: 25mm;

      width: 100%;
      height: 110mm;

      border: 1px solid #333;

      display: grid;

      grid-template-columns:
        repeat(10, 1fr);
    }


    .nenkai-column {
      display: grid;

      grid-template-rows:
        48% 52%;

      border-right: 1px solid #777;
    }

    .nenkai-column:last-child {
      border-right: 0;
    }


    .nenkai-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #999;
    }

    .nenkai-cell:last-child {
      border-bottom: 0;
    }


    .nenkai-name {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 8.5pt;
    }


    .nenkai-year {
      writing-mode: vertical-rl;
      text-orientation: upright;

      font-size: 9pt;
    }


    /* ========================================
       印刷
    ======================================== */

    @page {
      size: A4 landscape;
      margin: 0;
    }


    @media print {

      html,
      body {
        background: #fff;
      }


      .toolbar {
        display: none;
      }


      .page {
        width: 297mm;
        height: 210mm;

        margin: 0;

        box-shadow: none;

        page-break-after: always;
      }


      .page:last-child {
        page-break-after: auto;
      }


      /*
        折り線はPDFへ印刷しない
      */

      .screen-fold {
        display: none;
      }

    }


    /* ========================================
       スマホ・小画面
    ======================================== */

    @media screen and (max-width: 900px) {

      .page-wrapper {
        width: 297mm;

        transform-origin: top left;

        transform: scale(0.42);

        margin-bottom: -115mm;
      }

    }


    @media screen and (max-width: 600px) {

      .toolbar-buttons {
        flex-direction: column;
      }

      .toolbar button {
        width: 100%;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================
       操作
  ======================================= -->

  <div class="toolbar">

    <div class="print-guide">

      A4・横向きで印刷してください。<br>
      両面印刷する場合は、表裏の向きを確認してから印刷してください。

    </div>


    <div class="toolbar-buttons">

      <button
        type="button"
        class="back-button"
        onclick="history.back()"
      >
        戻る
      </button>


      <button
        type="button"
        onclick="startPrint()"
      >
        PDFとして保存・印刷
      </button>

    </div>

  </div>


  <div class="page-wrapper">


    <!-- ====================================
         表面
    ===================================== -->

    <section class="page front">

      <!-- 画面確認用折り線 -->

      <div class="screen-fold fold-1"></div>
      <div class="screen-fold fold-2"></div>


      <!-- 寺院情報 -->

      <div class="temple-info">

        <div class="temple-name vertical">
          曹洞宗 松久山 禅昌寺
        </div>


        <div class="temple-address vertical">
        </div>

      </div>


      <!-- 中陰 -->

      <div class="chuin-area">

        <div class="chuin-title">
          中　陰　表
        </div>


        <div
          class="chuin-table"
          id="chuinTable"
        ></div>


        <div class="chuin-description">

          <strong>
            中陰とは
          </strong>

          ご命日から四十九日までの期間を中陰といい、
          七日ごとに故人を偲び、ご供養を勤めます。
          初七日から七七日（四十九日）まで七日ごとに忌日を迎えます。

        </div>

      </div>


      <!-- 位牌 -->

      <div class="ihai-area">

        <div class="ihai">

          <div class="ihai-top"></div>

          <div class="ihai-body"></div>

          <div class="ihai-base-1"></div>

          <div class="ihai-base-2"></div>


          <div
            class="ihai-date"
            id="ihaiDate"
          ></div>


          <div
            class="ihai-main"
            id="ihaiMain"
          ></div>


          <div
            class="ihai-left"
            id="ihaiLeft"
          ></div>

        </div>

      </div>

    </section>



    <!-- ====================================
         裏面
    ===================================== -->

    <section class="page back">

      <!-- 画面確認用折り線 -->

      <div class="screen-fold fold-1"></div>
      <div class="screen-fold fold-2"></div>


      <!-- 将来利用 -->

      <div class="back-extra">
      </div>


      <!-- 年回表 -->

      <div class="nenkai-area">

        <div class="nenkai-title">
          年　回　表
        </div>


        <div
          class="nenkai-table"
          id="nenkaiTable"
        ></div>

      </div>

    </section>

  </div>


  <script>

    /*
      ========================================
      memorial.html から受け取ったPDFデータ
      ========================================
    */

    const stored =
      sessionStorage.getItem(
        "zenshojiPdfData"
      );


    if (!stored) {

      alert(
        "印刷用の情報がありません。中陰表・年回表から作成してください。"
      );

      window.location.href =
        "memorial.html";

    }


    const data =
      stored
        ? JSON.parse(stored)
        : null;


    /*
      ========================================
      漢数字変換
      位牌内のみ使用
      〇は使わない
      ========================================
    */

    function numberToKanji(n) {

      const digits = [
        "",
        "一",
        "二",
        "三",
        "四",
        "五",
        "六",
        "七",
        "八",
        "九"
      ];


      if (n < 10) {
        return digits[n];
      }


      if (n === 10) {
        return "十";
      }


      if (n < 20) {

        return (
          "十" +
          digits[n - 10]
        );
      }


      if (n < 100) {

        const tens =
          Math.floor(
            n / 10
          );

        const ones =
          n % 10;


        return (
          digits[tens] +
          "十" +
          digits[ones]
        );
      }


      if (n < 1000) {

        const hundreds =
          Math.floor(
            n / 100
          );

        const remainder =
          n % 100;


        let result = "";


        if (hundreds === 1) {

          result +=
            "百";

        } else {

          result +=
            digits[hundreds] +
            "百";
        }


        if (remainder > 0) {

          result +=
            numberToKanji(
              remainder
            );
        }


        return result;
      }


      if (n < 10000) {

        const thousands =
          Math.floor(
            n / 1000
          );

        const remainder =
          n % 1000;


        let result = "";


        if (thousands === 1) {

          result +=
            "千";

        } else {

          result +=
            digits[thousands] +
            "千";
        }


        if (remainder > 0) {

          result +=
            numberToKanji(
              remainder
            );
        }


        return result;
      }


      return String(n);

    }


    /*
      ========================================
      和暦文字列を
      位牌用の漢数字表記へ変換

      例：
      令和8年8月1日
      ↓
      令和八年八月一日
      ========================================
    */

    function japaneseDateToKanji(
      text
    ) {

      const match =
        String(text)
          .match(
            /^(大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日$/
          );


      if (!match) {

        return text;
      }


      const era =
        match[1];

      const eraYear =
        match[2];

      const month =
        Number(
          match[3]
        );

      const day =
        Number(
          match[4]
        );


      const eraYearText =
        eraYear === "元"
          ? "元"
          : numberToKanji(
              Number(
                eraYear
              )
            );


      return (
        era +
        eraYearText +
        "年" +
        numberToKanji(
          month
        ) +
        "月" +
        numberToKanji(
          day
        ) +
        "日"
      );

    }


    /*
      ========================================
      数字年齢を漢数字へ
      ========================================
    */

    function ageToKanji(
      age
    ) {

      if (!age) {
        return "";
      }


      const number =
        Number(age);


      if (
        !number ||
        number < 1
      ) {

        return age;
      }


      return (
        numberToKanji(
          number
        ) +
        "歳"
      );

    }


    /*
      ========================================
      HTMLエスケープ
      ========================================
    */

    function escapeHtml(
      text
    ) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /*
      ========================================
      位牌
      ========================================
    */

    if (data) {

      const ihaiDate =
        document.getElementById(
          "ihaiDate"
        );


      ihaiDate.textContent =
        japaneseDateToKanji(
          data.deathDateJapanese
        );


      const ihaiMain =
        document.getElementById(
          "ihaiMain"
        );


      const ihaiLeft =
        document.getElementById(
          "ihaiLeft"
        );


      /*
        戒名あり
      */

      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {

        ihaiMain.textContent =
          data.kaimyo.trim();


        let leftText = "";


        if (
          data.name &&
          data.name.trim()
        ) {

          leftText +=
            "俗名　" +
            data.name.trim();
        }


        if (
          data.age &&
          String(data.age).trim()
        ) {

          if (leftText) {

            leftText +=
              "　";
          }


          leftText +=
            "行年　" +
            ageToKanji(
              data.age
            );
        }


        ihaiLeft.textContent =
          leftText;

      }


      /*
        戒名なし
      */

      else {

        const name =
          data.name &&
          data.name.trim()
            ? data.name.trim()
            : "";


        ihaiMain.innerHTML = `

          <span
            style="
              font-size:0.58em;
            "
          >
            俗名
          </span>

          <span
            style="
              font-size:1.15em;
            "
          >
            ${escapeHtml(name)}
          </span>

          <span
            style="
              font-size:0.58em;
            "
          >
            之精霊位
          </span>

        `;


        if (
          data.age &&
          String(data.age).trim()
        ) {

          ihaiLeft.textContent =
            "行年　" +
            ageToKanji(
              data.age
            );

        } else {

          ihaiLeft.textContent =
            "";
        }

      }


      /*
        ========================================
        中陰表
        右から左へ
        ========================================
      */

      const chuinTable =
        document.getElementById(
          "chuinTable"
        );


      chuinTable.innerHTML =
        "";


      const chuinForPrint =
        [...data.chuin]
          .reverse();


      chuinForPrint.forEach(
        function (item) {

          const column =
            document.createElement(
              "div"
            );


          column.className =
            "chuin-column";


          column.innerHTML = `

            <div
              class="chuin-cell"
            >

              <div
                class="chuin-name"
              >
                ${escapeHtml(
                  item.name
                )}
              </div>

            </div>


            <div
              class="chuin-cell"
            >

              <div
                class="old-name"
              >
                &nbsp;
              </div>

            </div>


            <div
              class="chuin-cell"
            >

              <div
                class="chuin-date"
              >
                ${escapeHtml(
                  item.date
                )}
              </div>

            </div>

          `;


          chuinTable
            .appendChild(
              column
            );

        }
      );


      /*
        ========================================
        年回表
        右から一周忌
        ========================================
      */

      const nenkaiTable =
        document.getElementById(
          "nenkaiTable"
        );


      nenkaiTable.innerHTML =
        "";


      const nenkaiForPrint =
        [...data.nenkai]
          .reverse();


      nenkaiForPrint.forEach(
        function (item) {

          const column =
            document.createElement(
              "div"
            );


          column.className =
            "nenkai-column";


          column.innerHTML = `

            <div
              class="nenkai-cell"
            >

              <div
                class="nenkai-name"
              >
                ${escapeHtml(
                  item.name
                )}
              </div>

            </div>


            <div
              class="nenkai-cell"
            >

              <div
                class="nenkai-year"
              >
                ${escapeHtml(
                  item.year
                )}
              </div>

            </div>

          `;


          nenkaiTable
            .appendChild(
              column
            );

        }
      );


      /*
        ========================================
        寺院情報
        ========================================
      */

      const templeName =
        document.querySelector(
          ".temple-name"
        );


      const templeAddress =
        document.querySelector(
          ".temple-address"
        );


      if (templeName) {

        templeName.textContent =
          data.temple.name;

      }


      if (templeAddress) {

        templeAddress.innerHTML = `

          ${escapeHtml(
            data.temple.postal
          )}

          ${escapeHtml(
            data.temple.address
          )}

          電話

          ${escapeHtml(
            data.temple.tel
          )}

        `;

      }

    }


    /*
      ========================================
      PDF保存・印刷
      ========================================
    */

    function startPrint() {

      /*
        ブラウザがPDF保存時の
        初期ファイル名として
        titleを使う場合に備える
      */

      document.title =
        "中陰年回表";


      window.print();

    }

  </script>

</body>
</html>
