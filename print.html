<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>中陰年回表</title>


  <!--
    PDF直接生成用 jsPDF
  -->

  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@4.0.0/dist/jspdf.umd.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      background: #ddd;

      color: #111;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
    }


    /* ========================================
       操作部分
    ======================================== */

    .toolbar {
      position: sticky;

      top: 0;

      z-index: 100;

      padding: 12px;

      background: #fff;

      border-bottom:
        1px solid #bbb;

      text-align: center;
    }


    .print-guide {
      margin-bottom:
        10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      font-size:
        14px;

      line-height:
        1.6;

      color:
        #555;
    }


    .toolbar-buttons {
      display: flex;

      justify-content:
        center;

      gap:

    }


    .toolbar button {
      padding:
        12px 22px;

      border:
        0;

      border-radius:

    }


    .back-button {

        -apple-system,
        BlinkMacSystemFont,

        sans-serif;

      font-size:
        13px;

      color:
        #666;
    }


    /* ========================================
       A4横プレビュー
       ======================================== */

    .page {
      position: relative;

      width: 297mm;
      height: 210mm;

      margin:
        14mm auto;

        #fff;

      画面確認用折り線

      top: 0;
      bottom: 0;

        1px dashed #bbb;

      pointer-events:

    }


    .fold-1 {

      left: 198mm;
    }


    .vertical {
      writing-mode:

      text-orientation:
        upright;

    /* ========================================
       表面
       ======================================== */

    .temple-info {
      position:
        absolute;

      left: 8mm;
      top: 17mm;

      width: 38mm;

      display: flex;

      justify-content:
        center;

      gap: 5mm;

    .temple-name {
      font-size:

    }


    .temple-address {
      font-size:
        7.4pt;

      line-height:

    }


    .chuin-area {
      position:
        absolute;

      left: 48mm;
      top: 13mm;

      width: 143mm;
      height: 184mm;
    }


    .chuin-title {
      position:
        absolute;

      top: 0;
      left: 0;

      text-align:

      font-size:
        19pt;

    }


    .chuin-table {

      left: 0;

        1px solid #333;

      display:

      grid-template-columns:
        repeat(8, 1fr);
    }


    .chuin-column {
      border-right:
        1px solid #777;

      display:

    .chuin-column:last-child {

    .chuin-cell {

    }


    .chuin-cell:last-child {

    .chuin-name {
      writing-mode:

        center;

    .old-name {

        upright;

    .chuin-date {
      writing-mode:

    }


    .chuin-description {
      position:
        absolute;

      left: 2mm;
      right: 2mm;

      top: 143mm;

      min-height:

      border-top:
        1px solid #aaa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,

        "Meiryo",
        sans-serif;

      font-size:
        8.5pt;

      line-height:
        1.7;
    }


    .chuin-description strong {
      display:
        block;

      margin-bottom:
        2mm;

      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      font-size:
        10pt;
    }


    /*
      位牌：右99mm内
    */

    .ihai-area {
      position:
        absolute;

      left: 201mm;
      top: 10mm;

      width: 86mm;
      height: 190mm;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;
    }


    .ihai {
      position:

    .ihai-top {

      border-left:
        1.3px solid #222;

        1.3px solid #222;

    }


    .ihai-base-1 {
      position:

      left: 4mm;

    }


    .ihai-base-2 {
      position:
        absolute;

      bottom: 9mm;
      left: 9mm;

      width: 42mm;

      border-top:
        1.3px solid #222;
    }


    .ihai-main {
      position:
        absolute;

      top: 33mm;
      right: 20mm;

      height: 100mm;

      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size:
        16pt;

      letter-spacing:
        0.08em;
    }


    .ihai-date {
      position:
        absolute;

      top: 40mm;
      right: 8mm;

      height: 95mm;

      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size:
        9pt;
    }


    .ihai-left {
      position:
        absolute;

      top: 40mm;
      left: 8mm;

      height: 100mm;

      writing-mode:
        vertical-rl;

      text-orientation:

      font-size:
        8.5pt;

    /* ========================================
       裏面
       ======================================== */

    .back-extra {
      position:
        absolute;

      left: 12mm;

      width: 70mm;

    }


    .nenkai-area {
      position:
        absolute;

      left: 83mm;
      top: 14mm;

      width: 202mm;
      height: 180mm;
    }


    .nenkai-title {

        100%;

      text-align:

        19pt;

        600;

      letter-spacing:

    }


    .nenkai-table {

        absolute;

      left: 0;
      top: 25mm;

      width: 100%;
      height: 110mm;

      border:
        1px solid #333;

      display:
        grid;

      grid-template-columns:
        repeat(10, 1fr);
    }


    .nenkai-column {
      display:
        grid;

    .nenkai-column:last-child {

    .nenkai-cell {
      display:

      justify-content:

    }


    .nenkai-cell:last-child {

        0;
    }


    .nenkai-name {
      writing-mode:
        vertical-rl;

      text-orientation:
        upright;

      font-size:
        8.5pt;
    }


    .nenkai-year {

        vertical-rl;

        upright;

    }


    /* ========================================
       印刷
       ======================================== */

    @page {
      size:
        A4 landscape;

      margin:
        0;
    }


    @media print {

      html,
      body {
        background:
          #fff;
      }


      .toolbar {
        display:
          none;
      }


      .page {
        width: 297mm;
        height: 210mm;

        margin: 0;

        box-shadow:
          none;

        page-break-after:
          always;
      }


      .page:last-child {
        page-break-after:

      }

      }

    @media

    (max-width: 900px) {

          297mm;

<body>


  <!-- ========================================

  <div class="toolbar">


    <div class="print-guide">

  <div class="page-wrapper">


    <!-- ========================================

    <section class="page front">

      ></div>

      <div

        </div>

          class="chuin-table"

        ></div>


        <div class="chuin-description">

  <strong>
    中陰とは
  </strong>

  ご命日から四十九日までの期間を「中陰」といいます。<br>

  この間、初七日から七七日（四十九日）まで、

</div>

      </div>


      <div class="nenkai-area">

  </div>


  <script>

    /*
      ========================================
      データ取得
      ========================================
    */

    const stored =
      sessionStorage.getItem(
        "zenshojiPdfData"
      );


    if (!stored) {

      alert(
        "印刷用の情報がありません。"
      );

      window.location.href =
        "memorial.html";

    }


    const data =
      stored
        ? JSON.parse(
            stored
          )
        : null;


    /*
      ========================================
      漢数字
      位牌用
      ========================================
    */

    function numberToKanji(n) {

      const digits = [
        "",
        "一",
        "二",
        "三",
        "四",
        "五",
        "六",
        "七",
        "八",
        "九"
      ];


      n =
        Number(n);


      if (n < 10) {
        return digits[n];
      }


      if (n === 10) {
        return "十";
      }


      if (n < 20) {

        return (
          "十" +
          digits[n - 10]
        );

      }


      if (n < 100) {

        const tens =
          Math.floor(
            n / 10
          );

        const ones =
          n % 10;


        return (
          digits[tens] +
          "十" +
          digits[ones]
        );

      }


      if (n < 1000) {

        const hundreds =
          Math.floor(
            n / 100
          );

        const remainder =
          n % 100;


        let text = "";


        if (hundreds === 1) {
          text += "百";
        }

        else {
          text +=
            digits[hundreds] +
            "百";
        }


        if (remainder) {

          text +=
            numberToKanji(
              remainder
            );

        }


        return text;

      }


      return String(n);

    }


    function japaneseDateToKanji(
      text
    ) {

      const match =
        String(text)
          .match(
            /^(大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日$/
          );


      if (!match) {
        return text;
      }


      const era =
        match[1];


      const year =
        match[2] === "元"
          ? "元"
          : numberToKanji(
              Number(
                match[2]
              )
            );


      const month =
        numberToKanji(
          Number(
            match[3]
          )
        );


      const day =
        numberToKanji(
          Number(
            match[4]
          )
        );


      return (
        era +
        year +
        "年" +
        month +
        "月" +
        day +
        "日"
      );

    }


    function ageToKanji(age) {

      if (!age) {
        return "";
      }


      return (
        numberToKanji(
          Number(age)
        ) +
        "歳"
      );

    }


    function escapeHtml(text) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /*
      ========================================
      HTMLプレビュー生成
      ========================================
    */

    function buildPreview() {


      /*
        寺院
      */

      document
        .querySelector(
          ".temple-name"
        )
        .textContent =
        data.temple.name;


      document
        .querySelector(
          ".temple-address"
        )
        .textContent =
        (
          data.temple.postal +
          "　" +
          data.temple.address +
          "　電話" +
          data.temple.tel
        );


      /*
        位牌
      */

      document
        .getElementById(
          "ihaiDate"
        )
        .textContent =
        japaneseDateToKanji(
          data.deathDateJapanese
        );


      const ihaiMain =
        document.getElementById(
          "ihaiMain"
        );


      const ihaiLeft =
        document.getElementById(
          "ihaiLeft"
        );


      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {


        ihaiMain.textContent =
          data.kaimyo.trim();


        let text = "";


        if (
          data.name &&
          data.name.trim()
        ) {

          text +=
            "俗名　" +
            data.name.trim();

        }


        if (
          data.age &&
          String(
            data.age
          ).trim()
        ) {


          if (text) {
            text += "　";
          }


          text +=
            "行年　" +
            ageToKanji(
              data.age
            );

        }


        ihaiLeft.textContent =
          text;

      }


      else {


        const name =
          data.name
            ? data.name.trim()
            : "";


        ihaiMain.innerHTML = `

          <span
            style="
              font-size:0.58em;
            "
          >
            俗名
          </span>

          <span
            style="
              font-size:1.15em;
            "
          >
            ${escapeHtml(name)}
          </span>

          <span
            style="
              font-size:0.58em;
            "
          >
            之精霊位
          </span>

        `;


        if (data.age) {

          ihaiLeft.textContent =
            "行年　" +
            ageToKanji(
              data.age
            );

        }

        else {

          ihaiLeft.textContent =
            "";

        }

      }


      /*
        中陰表
      */

      const chuinTable =
        document.getElementById(
          "chuinTable"
        );


      chuinTable.innerHTML =
        "";


      [
        ...data.chuin
      ]
        .reverse()
        .forEach(

          function (item) {


            const column =
              document.createElement(
                "div"
              );


            column.className =
              "chuin-column";


            column.innerHTML = `

              <div
                class="chuin-cell"
              >

                <div
                  class="chuin-name"
                >
                  ${escapeHtml(
                    item.name
                  )}
                </div>

              </div>


              <div
                class="chuin-cell"
              >

                <div
  class="old-name"
>
  ${escapeHtml(
    item.oldName || ""
  )}
</div>>

              </div>


              <div
                class="chuin-cell"
              >

                <div
                  class="chuin-date"
                >
                  ${escapeHtml(
                    item.date
                  )}
                </div>

              </div>

            `;


            chuinTable.appendChild(
              column
            );

          }

        );


      /*
        年回表
      */

      const nenkaiTable =
        document.getElementById(
          "nenkaiTable"
        );


      nenkaiTable.innerHTML =
        "";


      [
        ...data.nenkai
      ]
        .reverse()
        .forEach(

          function (item) {


            const column =
              document.createElement(
                "div"
              );


            column.className =
              "nenkai-column";


            column.innerHTML = `

              <div
                class="nenkai-cell"
              >

                <div
                  class="nenkai-name"
                >
                  ${escapeHtml(
                    item.name
                  )}
                </div>

              </div>


              <div
                class="nenkai-cell"
              >

                <div
                  class="nenkai-year"
                >
                  ${escapeHtml(
                    item.year
                  )}
                </div>

              </div>

            `;


            nenkaiTable.appendChild(
              column
            );

          }

        );

    }


    /*
      ========================================
      Canvas PDF描画
      ========================================

      CSS縦書きをPDFへ変換するのではなく、
      PDF用Canvasへ直接描画する。
    */


    const PDF_SCALE =
      10;


    const PAGE_W_MM =
      297;


    const PAGE_H_MM =
      210;


    function mm(value) {

      return (
        value *
        PDF_SCALE
      );

    }


    function createPageCanvas() {


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        mm(
          PAGE_W_MM
        );


      canvas.height =
        mm(
          PAGE_H_MM
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#111111";


      ctx.strokeStyle =
        "#222222";


      return {
        canvas,
        ctx
      };

    }


    function setFont(
      ctx,
      sizePx,
      weight = "normal",
      family = "serif"
    ) {

      const families =
        family === "sans"
          ? '"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif'
          : '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif';


      ctx.font =
        weight +
        " " +
        sizePx +
        "px " +
        families;


      ctx.textBaseline =
        "top";

    }


    function drawVerticalText(
      ctx,
      text,
      x,
      y,
      options = {}
    ) {


      const size =
        options.size ||
        mm(3.5);


      const gap =
        options.gap ||
        size * 1.08;


      const maxHeight =
        options.maxHeight ||
        Infinity;


      const weight =
        options.weight ||
        "normal";


      const family =
        options.family ||
        "serif";


      setFont(
        ctx,
        size,
        weight,
        family
      );


      const chars =
        Array.from(
          String(text)
        );


      let yy =
        y;


      chars.forEach(

        function (char) {


          if (
            yy - y + gap >
            maxHeight
          ) {

            return;

          }


          const metrics =
            ctx.measureText(
              char
            );


          ctx.fillText(
            char,
            x -
              metrics.width /
              2,
            yy
          );


          yy +=
            gap;

        }

      );

    }


    function drawCenteredText(
      ctx,
      text,
      centerX,
      y,
      size,
      weight = "normal",
      family = "serif"
    ) {


      setFont(
        ctx,
        size,
        weight,
        family
      );


      const width =
        ctx.measureText(
          text
        ).width;


      ctx.fillText(
        text,
        centerX -
          width / 2,
        y
      );

    }


    /*
      ========================================
      PDF表面
      ========================================
    */

    function renderFrontCanvas() {


      const {
        canvas,
        ctx
      } =
        createPageCanvas();


      /*
        寺院情報
      */

      drawVerticalText(
        ctx,
        data.temple.name,
        mm(34),
        mm(24),
        {
          size:
            mm(3.5),

          gap:
            mm(4.2),

          maxHeight:
            mm(140)
        }
      );


      drawVerticalText(
        ctx,
        (
          data.temple.postal +
          data.temple.address +
          "電話" +
          data.temple.tel
        ),
        mm(20),
        mm(24),
        {
          size:
            mm(2.4),

          gap:
            mm(3.0),

          maxHeight:
            mm(155),

          family:
            "sans"
        }
      );


      /*
        中陰表タイトル
      */

      drawCenteredText(
        ctx,
        "中　陰　表",
        mm(119.5),
        mm(14),
        mm(6.5),
        "600"
      );


      /*
        中陰表
      */

      const tableX =
        mm(48);


      const tableY =
        mm(37);


      const tableW =
        mm(143);


      const tableH =
        mm(111);


      ctx.lineWidth =
        mm(0.18);


      ctx.strokeRect(
        tableX,
        tableY,
        tableW,
        tableH
      );


      const columns =
        8;


      const columnW =
        tableW /
        columns;


      const row1 =
        tableY +
        tableH *
        0.36;


      const row2 =
        tableY +
        tableH *
        0.61;


      ctx.beginPath();

      ctx.moveTo(
        tableX,
        row1
      );

      ctx.lineTo(
        tableX + tableW,
        row1
      );

      ctx.moveTo(
        tableX,
        row2
      );

      ctx.lineTo(
        tableX + tableW,
        row2
      );


      for (
        let i = 1;
        i < columns;
        i++
      ) {

        const x =
          tableX +
          columnW *
          i;


        ctx.moveTo(
          x,
          tableY
        );


        ctx.lineTo(
          x,
          tableY +
          tableH
        );

      }


      ctx.stroke();


      const chuin =
        [
          ...data.chuin
        ].reverse();


      chuin.forEach(

        function (
          item,
          index
        ) {


          const cx =
            tableX +
            columnW *
            index +
            columnW /
            2;


          drawVerticalText(
            ctx,
            item.name,
            cx,
            tableY +
              mm(5),
            {
              size:
                mm(2.9),

              gap:
                mm(3.3),

              maxHeight:
                tableH *
                0.31
            }
          );


          /*
  旧呼称
*/

if (
  item.oldName
) {

  drawVerticalText(
    ctx,
    item.oldName,
    cx,
    row1 +
      mm(4),
    {
      size:
        mm(2.6),

      gap:
        mm(3.0),

      maxHeight:
        tableH *
        0.20
    }
  );

}


          drawVerticalText(
            ctx,
            item.date,
            cx,
            row2 +
              mm(4),
            {
              size:
                mm(2.8),

              gap:
                mm(3.15),

              maxHeight:
                tableH *
                  0.35
            }
          );

        }

      );


      /*
        中陰とは
      */

      setFont(
        ctx,
        mm(3.3),
        "600",
        "sans"
      );


      ctx.fillText(
        "中陰とは",
        mm(51),
        mm(158)
      );


      setFont(
        ctx,
        mm(2.5),
        "normal",
        "sans"
      );


      const descriptionLines = [

  "ご命日から四十九日までの期間を「中陰」といいます。",

  "この間、初七日から七七日（四十九日）まで、",

  "七日ごとに忌日を迎え、故人を偲びご供養を勤めます。"

];


      descriptionLines
        .forEach(

          function (
            line,
            index
          ) {

            ctx.fillText(
              line,
              mm(51),
              mm(
                166 +
                index *
                6
              )
            );

          }

        );


      /*
        位牌
        右側198～297mm以内
      */

      drawIhaiCanvas(
        ctx
      );


      return canvas;

    }


    /*
      ========================================
      位牌PDF描画
      ========================================
    */

    function drawIhaiCanvas(
      ctx
    ) {


      const left =
        mm(214);


      const top =
        mm(24);


      const width =
        mm(60);


      const height =
        mm(162);


      /*
        位牌本体
      */

      ctx.lineWidth =
        mm(0.25);


      ctx.strokeRect(
        left +
          mm(7),
        top +
          mm(19),
        width -
          mm(14),
        height -
          mm(39)
      );


      /*
        上部
      */

      ctx.beginPath();


      ctx.moveTo(
        left +
          mm(18),
        top +
          mm(19)
      );


      ctx.lineTo(
        left +
          width /
          2,
        top +
          mm(5)
      );


      ctx.lineTo(
        left +
          width -
          mm(18),
        top +
          mm(19)
      );


      ctx.stroke();


      /*
        台座
      */

      ctx.beginPath();


      ctx.moveTo(
        left +
          mm(4),
        top +
          height -
          mm(15)
      );


      ctx.lineTo(
        left +
          width -
          mm(4),
        top +
          height -
          mm(15)
      );


      ctx.moveTo(
        left +
          mm(10),
        top +
          height -
          mm(9)
      );


      ctx.lineTo(
        left +
          width -
          mm(10),
        top +
          height -
          mm(9)
      );


      ctx.stroke();


      /*
        命日
      */

      drawVerticalText(
        ctx,
        japaneseDateToKanji(
          data.deathDateJapanese
        ),
        left +
          width -
          mm(10),
        top +
          mm(34),
        {
          size:
            mm(3.0),

          gap:
            mm(3.4),

          maxHeight:
            mm(100)
        }
      );


      /*
        戒名あり
      */

      if (
        data.kaimyo &&
        data.kaimyo.trim()
      ) {


        drawVerticalText(
          ctx,
          data.kaimyo.trim(),
          left +
            width /
            2,
          top +
            mm(29),
          {
            size:
              mm(5.0),

            gap:
              mm(5.6),

            maxHeight:
              mm(105),

            weight:
              "600"
          }
        );


        let leftText =
          "";


        if (
          data.name &&
          data.name.trim()
        ) {

          leftText +=
            "俗名" +
            data.name.trim();

        }


        if (data.age) {

          if (leftText) {

            leftText +=
              "　";

          }


          leftText +=
            "行年" +
            ageToKanji(
              data.age
            );

        }


        if (leftText) {

          drawVerticalText(
            ctx,
            leftText,
            left +
              mm(10),
            top +
              mm(34),
            {
              size:
                mm(2.8),

              gap:
                mm(3.2),

              maxHeight:
                mm(100)
            }
          );

        }

      }


      /*
        戒名なし
      */

      else {


        const name =
          data.name
            ? data.name.trim()
            : "";


        const cx =
          left +
          width /
          2;


        let y =
          top +
          mm(31);


        drawVerticalText(
          ctx,
          "俗名",
          cx,
          y,
          {
            size:
              mm(3.0),

            gap:
              mm(3.4)
          }
        );


        y +=
          mm(12);


        drawVerticalText(
          ctx,
          name,
          cx,
          y,
          {
            size:
              mm(5.1),

            gap:
              mm(5.7),

            weight:
              "600"
          }
        );


        y +=
          mm(
            Math.max(
              18,
              name.length *
                6
            )
          );


        drawVerticalText(
          ctx,
          "之精霊位",
          cx,
          y,
          {
            size:
              mm(3.0),

            gap:
              mm(3.4)
          }
        );


        if (data.age) {

          drawVerticalText(
            ctx,
            "行年" +
              ageToKanji(
                data.age
              ),
            left +
              mm(10),
            top +
              mm(40),
            {
              size:
                mm(2.8),

              gap:
                mm(3.2)
            }
          );

        }

      }

    }


    /*
      ========================================
      PDF裏面
      ========================================
    */

    function renderBackCanvas() {


      const {
        canvas,
        ctx
      } =
        createPageCanvas();


      drawCenteredText(
        ctx,
        "年　回　表",
        mm(184),
        mm(14),
        mm(6.5),
        "600"
      );


      const tableX =
        mm(83);


      const tableY =
        mm(39);


      const tableW =
        mm(202);


      const tableH =
        mm(110);


      ctx.lineWidth =
        mm(0.18);


      ctx.strokeRect(
        tableX,
        tableY,
        tableW,
        tableH
      );


      const nenkai =
        [
          ...data.nenkai
        ].reverse();


      const count =
        nenkai.length;


      const columnW =
        tableW /
        count;


      const splitY =
        tableY +
        tableH *
        0.48;


      ctx.beginPath();


      ctx.moveTo(
        tableX,
        splitY
      );


      ctx.lineTo(
        tableX +
          tableW,
        splitY
      );


      for (
        let i = 1;
        i < count;
        i++
      ) {


        const x =
          tableX +
          columnW *
          i;


        ctx.moveTo(
          x,
          tableY
        );


        ctx.lineTo(
          x,
          tableY +
          tableH
        );

      }


      ctx.stroke();


      nenkai.forEach(

        function (
          item,
          index
        ) {


          const cx =
            tableX +
            columnW *
            index +
            columnW /
            2;


          drawVerticalText(
            ctx,
            item.name,
            cx,
            tableY +
              mm(7),
            {
              size:
                mm(3.0),

              gap:
                mm(3.5),

              maxHeight:
                tableH *
                0.40
            }
          );


          drawVerticalText(
            ctx,
            item.year,
            cx,
            splitY +
              mm(10),
            {
              size:
                mm(3.1),

              gap:
                mm(3.6)
            }
          );

        }

      );


      return canvas;

    }


    /*
      ========================================
      PDF直接保存
      ========================================
    */

    async function savePdf() {


      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "PDFを作成しています…";


      try {


        /*
          ブラウザの日本語フォント読み込み待ち
        */

        if (
          document.fonts &&
          document.fonts.ready
        ) {

          await document.fonts.ready;

        }


        if (
          !window.jspdf ||
          !window.jspdf.jsPDF
        ) {

          throw new Error(
            "jsPDFが読み込まれていません。"
          );

        }


        const front =
          renderFrontCanvas();


        const back =
          renderBackCanvas();


        const {
          jsPDF
        } =
          window.jspdf;


        const pdf =
          new jsPDF({

            orientation:
              "landscape",

            unit:
              "mm",

            format:
              "a4",

            compress:
              true

          });


        /*
          1ページ目：表
        */

        pdf.addImage(

          front.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        /*
          2ページ目：裏
        */

        pdf.addPage(
          "a4",
          "landscape"
        );


        pdf.addImage(

          back.toDataURL(
            "image/png"
          ),

          "PNG",

          0,
          0,

          297,
          210,

          undefined,

          "FAST"

        );


        /*
          印刷画面を経由せず直接保存
        */

        pdf.save(
          "中陰年回表.pdf"
        );


        status.textContent =
          "中陰年回表.pdf を作成しました。";


      }


      catch (error) {


        console.error(
          error
        );


        status.textContent =
          "PDFを作成できませんでした。時間をおいてもう一度お試しください。";


      }

    }


    document
      .getElementById(
        "pdfSaveButton"
      )
      .addEventListener(

        "click",

        savePdf

      );


    /*
      ========================================
      開始
      ========================================
    */

    if (data) {

      buildPreview();

    }

  </script>
