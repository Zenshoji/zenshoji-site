<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>中陰表・年回表 | 禅昌寺</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      padding: 26px 20px;
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    .header-inner {
      width: min(1000px, calc(100% - 20px));
      margin: 0 auto;
    }

    .site-name {
      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    main {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 60px 0 80px;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 32px;
      font-weight: 600;
    }

    .intro {
      margin: 0 auto 42px;
      text-align: center;
      color: #666;
      font-size: 16px;
    }

    .input-card {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 30px 26px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }

    .field {
      margin-bottom: 22px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 600;
    }

    input,
    select {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
    }

    .death-date-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .date-part {
      min-width: 0;
    }

    .date-label {
      display: block;
      margin-bottom: 5px;
      color: #777;
      font-size: 13px;
    }

    .small-note {
      margin-top: 7px;
      font-size: 13px;
      color: #777;
    }

    .button-area {
      margin-top: 30px;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 14px 28px;
      background: #333;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #111;
    }

    .results {
      display: none;
      margin-top: 56px;
    }

    .person-box {
      max-width: 520px;
      margin: 0 auto 34px;
      padding: 18px 20px;
      background: #f6f6f4;
      border-radius: 6px;
    }

    .person-box p {
      margin: 4px 0;
    }

    .result-section {
      margin-top: 44px;
    }

    .result-section:first-of-type {
      margin-top: 0;
    }

    .result-section h2 {
      margin: 0 0 18px;
      font-size: 24px;
      text-align: center;
    }

    .table-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 10px 12px;
      vertical-align: middle;
    }

    th {
      background: #f3f3f1;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      width: 42%;
      text-align: left;
    }

    th:last-child,
    td:last-child {
      width: 58%;
      text-align: left;
    }

    .copy-area {
      margin-top: 34px;
      text-align: center;
    }

    .copy-button {
      background: #666;
    }

    .copy-message {
      margin-top: 10px;
      min-height: 24px;
      font-size: 14px;
      color: #666;
    }

    .future-note {
      max-width: 520px;
      margin: 42px auto 0;
      padding: 18px 20px;
      background: #f6f6f4;
      border-radius: 6px;
      color: #555;
      font-size: 14px;
    }

    .back {
      margin-top: 58px;
      text-align: center;
    }

    .back a {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    @media (max-width: 700px) {

      header {
        padding: 20px 16px;
      }

      .site-name {
        font-size: 20px;
      }

      main {
        width: min(100% - 24px, 900px);
        padding: 42px 0 60px;
      }

      h1 {
        font-size: 27px;
      }

      .intro {
        margin-bottom: 32px;
      }

      .input-card {
        padding: 22px 16px;
      }

      .death-date-grid {
        grid-template-columns: 1fr 0.8fr 0.8fr;
        gap: 8px;
      }

      input,
      select {
        padding: 12px 10px;
        font-size: 16px;
      }

      .result-section h2 {
        font-size: 22px;
      }

      .table-wrap {
        max-width: 100%;
      }

      th,
      td {
        padding: 9px 8px;
        font-size: 14px;
      }

      th:first-child,
      td:first-child {
        width: 46%;
      }

      th:last-child,
      td:last-child {
        width: 54%;
      }
    }

    @media (max-width: 420px) {

      .death-date-grid {
        grid-template-columns: 1fr 0.72fr 0.72fr;
        gap: 6px;
      }

      input,
      select {
        font-size: 15px;
      }

      button {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="site-name">
        松久山 禅昌寺
      </a>
    </div>
  </header>

  <main>

    <h1>中陰表・年回表</h1>

    <p class="intro">
      ご命日を入力すると、中陰の日程と今後の年回忌をご確認いただけます。
    </p>


    <section class="input-card">

      <div class="field">
        <label for="name">故人のお名前</label>
        <input
          type="text"
          id="name"
          placeholder="例：山田 太郎"
        >
      </div>


      <div class="field">
        <label for="kaimyo">戒名（任意）</label>
        <input
          type="text"
          id="kaimyo"
          placeholder="戒名がある場合に入力してください"
        >
      </div>


      <div class="field">

        <label>ご命日</label>

        <div class="death-date-grid">

          <div class="date-part">
            <span class="date-label">年</span>

            <input
              type="number"
              id="deathYear"
              inputmode="numeric"
              min="1800"
              max="2200"
              placeholder="例：2013"
            >
          </div>


          <div class="date-part">
            <span class="date-label">月</span>

            <select id="deathMonth">
              <option value="">月</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>


          <div class="date-part">
            <span class="date-label">日</span>

            <select id="deathDay">
              <option value="">日</option>
            </select>
          </div>

        </div>

        <div class="small-note">
          西暦で入力してください。
        </div>

      </div>


      <div class="field">

        <label for="age">行年（任意）</label>

        <input
          type="number"
          id="age"
          inputmode="numeric"
          min="0"
          max="150"
          placeholder="例：88"
        >

        <div class="small-note">
          数字のみ入力してください。
        </div>

      </div>


      <div class="button-area">

        <button
          type="button"
          id="createButton"
        >
          中陰表・年回表を表示する
        </button>

      </div>

    </section>


    <!-- 結果 -->

    <section
      class="results"
      id="results"
    >

      <div
        class="person-box"
        id="personBox"
      ></div>


      <!-- 中陰表 -->

      <section class="result-section">

        <h2>中陰表</h2>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>法要</th>
                <th>日付</th>
              </tr>
            </thead>

            <tbody id="chuinBody"></tbody>

          </table>

        </div>

      </section>


      <!-- 年回表 -->

      <section class="result-section">

        <h2>年回表</h2>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>年回忌</th>
                <th>年</th>
              </tr>
            </thead>

            <tbody id="nenkaiBody"></tbody>

          </table>

        </div>

      </section>


      <!-- コピー -->

      <div class="copy-area">

        <button
          type="button"
          class="copy-button"
          id="copyButton"
        >
          表の内容をコピー
        </button>

        <div
          class="copy-message"
          id="copyMessage"
        ></div>

      </div>


      <div class="future-note">
        印刷用PDF、位牌表示、十三仏、旧呼称などの機能は今後追加する予定です。
      </div>

    </section>


    <div class="back">
      <a href="index.html">
        トップページへ戻る
      </a>
    </div>

  </main>


  <script>

    /*
      ==================================================
      月の日数
      閏年を含めて自動計算
      ==================================================
    */

    function getDaysInMonth(year, month) {

      return new Date(
        Date.UTC(year, month, 0)
      ).getUTCDate();

    }


    /*
      ==================================================
      日のプルダウンを更新
      ==================================================
    */

    function updateDayOptions() {

      const year =
        Number(
          document
            .getElementById("deathYear")
            .value
        );

      const month =
        Number(
          document
            .getElementById("deathMonth")
            .value
        );

      const daySelect =
        document
          .getElementById("deathDay");

      const previousDay =
        Number(daySelect.value);

      daySelect.innerHTML =
        '<option value="">日</option>';


      if (!year || !month) {
        return;
      }


      const days =
        getDaysInMonth(
          year,
          month
        );


      for (
        let day = 1;
        day <= days;
        day++
      ) {

        const option =
          document.createElement(
            "option"
          );

        option.value = day;
        option.textContent = day;

        daySelect.appendChild(
          option
        );
      }


      if (
        previousDay &&
        previousDay <= days
      ) {

        daySelect.value =
          previousDay;

      }

    }


    document
      .getElementById("deathYear")
      .addEventListener(
        "input",
        updateDayOptions
      );


    document
      .getElementById("deathMonth")
      .addEventListener(
        "change",
        updateDayOptions
      );


    /*
      ==================================================
      日付処理
      ==================================================
    */

    function createUtcDate(
      year,
      month,
      day
    ) {

      return new Date(
        Date.UTC(
          year,
          month - 1,
          day
        )
      );

    }


    function addDays(
      date,
      days
    ) {

      const result =
        new Date(
          Date.UTC(
            date.getUTCFullYear(),
            date.getUTCMonth(),
            date.getUTCDate()
          )
        );

      result.setUTCDate(
        result.getUTCDate() +
        days
      );

      return result;

    }


    /*
      ==================================================
      西暦 → 和暦
      中陰表は和暦・算用数字
      ==================================================
    */

    function formatJapaneseDate(
      date
    ) {

      const year =
        date.getUTCFullYear();

      const month =
        date.getUTCMonth() + 1;

      const day =
        date.getUTCDate();


      const reiwaStart =
        new Date(
          Date.UTC(
            2019,
            4,
            1
          )
        );


      if (
        date >=
        reiwaStart
      ) {

        const reiwaYear =
          year - 2018;

        return (
          "令和" +
          reiwaYear +
          "年" +
          month +
          "月" +
          day +
          "日"
        );

      }


      const heiseiStart =
        new Date(
          Date.UTC(
            1989,
            0,
            8
          )
        );


      if (
        date >=
        heiseiStart
      ) {

        const heiseiYear =
          year - 1988;

        return (
          "平成" +
          heiseiYear +
          "年" +
          month +
          "月" +
          day +
          "日"
        );

      }


      const showaStart =
        new Date(
          Date.UTC(
            1926,
            11,
            25
          )
        );


      if (
        date >=
        showaStart
      ) {

        const showaYear =
          year - 1925;

        return (
          "昭和" +
          showaYear +
          "年" +
          month +
          "月" +
          day +
          "日"
        );

      }


      return (
        year +
        "年" +
        month +
        "月" +
        day +
        "日"
      );

    }


    /*
      ==================================================
      中陰
      命日を1日目として計算
      ==================================================
    */

    const chuinItems = [

      {
        name: "初七日",
        add: 6
      },

      {
        name: "二七日",
        add: 13
      },

      {
        name: "三七日",
        add: 20
      },

      {
        name: "四七日",
        add: 27
      },

      {
        name: "五七日",
        add: 34
      },

      {
        name: "六七日",
        add: 41
      },

      {
        name: "七七日（四十九日）",
        add: 48
      },

      {
        name: "百か日",
        add: 99
      }

    ];


    /*
      ==================================================
      年回忌
      ==================================================
    */

    const memorialItems = [

      {
        name: "一周忌",
        addYear: 1
      },

      {
        name: "三回忌",
        addYear: 2
      },

      {
        name: "七回忌",
        addYear: 6
      },

      {
        name: "十三回忌",
        addYear: 12
      },

      {
        name: "十七回忌",
        addYear: 16
      },

      {
        name: "二十三回忌",
        addYear: 22
      },

      {
        name: "二十七回忌",
        addYear: 26
      },

      {
        name: "三十三回忌",
        addYear: 32
      },

      {
        name: "三十七回忌",
        addYear: 36
      },

      {
        name: "五十回忌",
        addYear: 49
      }

    ];


    /*
      ==================================================
      入力された命日を取得
      ==================================================
    */

    function getDeathDateFromInput() {

      const year =
        Number(
          document
            .getElementById("deathYear")
            .value
        );

      const month =
        Number(
          document
            .getElementById("deathMonth")
            .value
        );

      const day =
        Number(
          document
            .getElementById("deathDay")
            .value
        );


      if (
        !year ||
        !month ||
        !day
      ) {

        return null;

      }


      const daysInMonth =
        getDaysInMonth(
          year,
          month
        );


      if (
        day >
        daysInMonth
      ) {

        return null;

      }


      return createUtcDate(
        year,
        month,
        day
      );

    }


    /*
      ==================================================
      表を作る
      ==================================================
    */

    document
      .getElementById(
        "createButton"
      )
      .addEventListener(
        "click",
        function () {

          const name =
            document
              .getElementById("name")
              .value
              .trim();

          const kaimyo =
            document
              .getElementById("kaimyo")
              .value
              .trim();

          const age =
            document
              .getElementById("age")
              .value
              .trim();


          const deathDate =
            getDeathDateFromInput();


          if (
            !deathDate
          ) {

            alert(
              "ご命日の年・月・日を入力してください。"
            );

            return;
          }


          /*
            故人情報
          */

          let personHtml = "";


          if (name) {

            personHtml +=
              "<p><strong>俗名：</strong>" +
              escapeHtml(name) +
              "</p>";

          }


          if (kaimyo) {

            personHtml +=
              "<p><strong>戒名：</strong>" +
              escapeHtml(kaimyo) +
              "</p>";

          }


          personHtml +=
            "<p><strong>命日：</strong>" +
            formatJapaneseDate(
              deathDate
            ) +
            "</p>";


          if (age) {

            personHtml +=
              "<p><strong>行年：</strong>" +
              escapeHtml(age) +
              "歳</p>";

          }


          document
            .getElementById(
              "personBox"
            )
            .innerHTML =
            personHtml;


          /*
            中陰表
          */

          const chuinBody =
            document
              .getElementById(
                "chuinBody"
              );

          chuinBody.innerHTML = "";


          chuinItems.forEach(
            function (item) {

              const targetDate =
                addDays(
                  deathDate,
                  item.add
                );


              const row =
                document.createElement(
                  "tr"
                );


              row.innerHTML =
                "<td>" +
                item.name +
                "</td>" +
                "<td>" +
                formatJapaneseDate(
                  targetDate
                ) +
                "</td>";


              chuinBody.appendChild(
                row
              );

            }
          );


          /*
            年回表
          */

          const deathYear =
            deathDate
              .getUTCFullYear();


          const nenkaiBody =
            document
              .getElementById(
                "nenkaiBody"
              );

          nenkaiBody.innerHTML = "";


          memorialItems.forEach(
            function (item) {

              const year =
                deathYear +
                item.addYear;


              const row =
                document.createElement(
                  "tr"
                );


              row.innerHTML =
                "<td>" +
                item.name +
                "</td>" +
                "<td>" +
                year +
                "年</td>";


              nenkaiBody.appendChild(
                row
              );

            }
          );


          document
            .getElementById(
              "results"
            )
            .style
            .display =
            "block";


          document
            .getElementById(
              "results"
            )
            .scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

        }
      );


    /*
      ==================================================
      コピー
      ==================================================
    */

    document
      .getElementById(
        "copyButton"
      )
      .addEventListener(
        "click",
        async function () {

          const name =
            document
              .getElementById("name")
              .value
              .trim();

          const kaimyo =
            document
              .getElementById("kaimyo")
              .value
              .trim();

          const age =
            document
              .getElementById("age")
              .value
              .trim();


          const deathDate =
            getDeathDateFromInput();


          if (!deathDate) {
            return;
          }


          let text = "";


          if (name) {

            text +=
              "俗名：" +
              name +
              "\n";

          }


          if (kaimyo) {

            text +=
              "戒名：" +
              kaimyo +
              "\n";

          }


          text +=
            "命日：" +
            formatJapaneseDate(
              deathDate
            ) +
            "\n";


          if (age) {

            text +=
              "行年：" +
              age +
              "歳\n";

          }


          text +=
            "\n【中陰表】\n";


          chuinItems.forEach(
            function (item) {

              const targetDate =
                addDays(
                  deathDate,
                  item.add
                );


              text +=
                item.name +
                "　" +
                formatJapaneseDate(
                  targetDate
                ) +
                "\n";

            }
          );


          text +=
            "\n【年回表】\n";


          const deathYear =
            deathDate
              .getUTCFullYear();


          memorialItems.forEach(
            function (item) {

              text +=
                item.name +
                "　" +
                (
                  deathYear +
                  item.addYear
                ) +
                "年\n";

            }
          );


          try {

            await navigator
              .clipboard
              .writeText(
                text
              );


            document
              .getElementById(
                "copyMessage"
              )
              .textContent =
              "コピーしました。";

          } catch (error) {

            document
              .getElementById(
                "copyMessage"
              )
              .textContent =
              "コピーできませんでした。";

          }

        }
      );


    /*
      ==================================================
      HTMLエスケープ
      ==================================================
    */

    function escapeHtml(text) {

      return text
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
</html>
