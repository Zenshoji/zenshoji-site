<script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function () {
  const main = document.querySelector("main");
  if (!main || typeof Kuroshiro === "undefined" || typeof KuromojiAnalyzer === "undefined") return;

  const fixed = {"妙法蓮華経観世音菩薩普門品偈": "みょうほうれんげきょうかんぜおんぼさつふもんぼんげ", "妙法蓮華経観世音菩薩普門品": "みょうほうれんげきょうかんぜおんぼさつふもんぼん", "妙法蓮華経如来寿量品偈": "みょうほうれんげきょうにょらいじゅりょうほんげ", "妙法蓮華経如来寿量品": "みょうほうれんげきょうにょらいじゅりょうほん", "般若心経": "はんにゃしんぎょう", "摩訶般若波羅蜜多心経": "まかはんにゃはらみったしんぎょう", "観自在菩薩": "かんじざいぼさつ", "般若波羅蜜多": "はんにゃはらみった", "阿耨多羅三藐三菩提": "あのくたらさんみゃくさんぼだい", "菩提薩埵": "ぼだいさった", "修証義": "しゅしょうぎ", "懺悔滅罪": "さんげめつざい", "受戒入位": "じゅかいにゅうい", "発願利生": "ほつがんりしょう", "行持報恩": "ぎょうじほうおん", "舎利礼文": "しゃりらいもん", "延命十句観音経": "えんめいじっくかんのんぎょう", "五観の偈": "ごかんのげ", "参同契": "さんどうかい", "宝鏡三昧": "ほうきょうざんまい", "仏遺教経": "ぶつゆいきょうぎょう", "大般若経": "だいはんにゃきょう", "釈迦牟尼仏": "しゃかむにぶつ", "観世音菩薩": "かんぜおんぼさつ", "観世音": "かんぜおん", "普門品偈": "ふもんぼんげ", "寿量品偈": "じゅりょうほんげ", "自我偈": "じがげ", "世尊妙相具": "せそんみょうそうぐ", "自我得仏来": "じがとくぶつらい", "菩提心": "ぼだいしん", "三宝": "さんぼう", "仏法僧": "ぶっぽうそう", "仏祖": "ぶっそ", "仏道": "ぶつどう", "涅槃": "ねはん", "智慧": "ちえ", "功徳": "くどく", "精進": "しょうじん", "禅定": "ぜんじょう", "少欲": "しょうよく", "知足": "ちそく", "遠離": "おんり", "不戯論": "ふけろん", "四諦": "したい", "解脱": "げだつ", "教誨": "きょうかい", "無常": "むじょう", "霊鷲山": "りょうじゅせん", "阿僧祇劫": "あそうぎこう", "大悲": "だいひ", "甘露門": "かんろもん", "開経偈": "かいきょうげ", "地蔵真言": "じぞうしんごん", "曹洞宗": "そうとうしゅう", "曹洞禅": "そうとうぜん", "禅昌寺": "ぜんしょうじ", "道元禅師": "どうげんぜんじ"};
  const keys = Object.keys(fixed).sort((a,b)=>b.length-a.length);
  const hasKanji = /[\u3400-\u4DBF\u4E00-\u9FFF々〆ヶ]/;

  function applyFixedToTextNode(node) {
    let text = node.nodeValue;
    if (!hasKanji.test(text)) return;
    let parts = [{text:text, ruby:false}];

    keys.forEach(key => {
      const next = [];
      parts.forEach(part => {
        if (part.ruby || !part.text.includes(key)) { next.push(part); return; }
        const bits = part.text.split(key);
        bits.forEach((bit, i) => {
          if (bit) next.push({text:bit, ruby:false});
          if (i < bits.length-1) next.push({text:key, ruby:true, reading:fixed[key]});
        });
      });
      parts = next;
    });

    if (!parts.some(p=>p.ruby)) return;
    const frag = document.createDocumentFragment();
    parts.forEach(part => {
      if (!part.ruby) {
        frag.appendChild(document.createTextNode(part.text));
      } else {
        const ruby = document.createElement("ruby");
        ruby.appendChild(document.createTextNode(part.text));
        const rt = document.createElement("rt");
        rt.textContent = part.reading;
        ruby.appendChild(rt);
        frag.appendChild(ruby);
      }
    });
    node.replaceWith(frag);
  }

  // Fixed Buddhist / chant readings first.
  const preWalker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
  const preNodes = [];
  while(preWalker.nextNode()) {
    const n = preWalker.currentNode;
    const p = n.parentElement;
    if (!p || ["SCRIPT","STYLE","RT","RUBY"].includes(p.tagName)) continue;
    if (p.closest(".source-list")) continue;
    if (hasKanji.test(n.nodeValue)) preNodes.push(n);
  }
  preNodes.forEach(applyFixedToTextNode);

  const kuroshiro = new Kuroshiro();
  try {
    await kuroshiro.init(new KuromojiAnalyzer({
      dictPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict"
    }));

    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while(walker.nextNode()) {
      const n = walker.currentNode;
      const p = n.parentElement;
      if (!p || ["SCRIPT","STYLE","RT","RUBY"].includes(p.tagName)) continue;
      if (p.closest(".source-list")) continue;
      if (hasKanji.test(n.nodeValue)) nodes.push(n);
    }

    for (const node of nodes) {
      if (!node.isConnected) continue;
      const converted = await kuroshiro.convert(node.nodeValue, {
        mode: "furigana",
        to: "hiragana"
      });
      const span = document.createElement("span");
      span.innerHTML = converted;
      node.replaceWith(...span.childNodes);
    }
  } catch (e) {
    console.error("Furigana conversion failed:", e);
  }
});
</script>
