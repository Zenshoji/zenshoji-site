  <style>
    * {

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",

    a {

    /* =========================
       ヘッダー
    ========================= */

    header {

      background: #fff;
    }

    .header-inner {
      width: min(1000px, calc(100% - 20px));
      margin: 0 auto;
    }

    .site-name {
      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",

        serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    /* =========================
       メイン
    ========================= */

    main {
      width: min(800px, calc(100% - 40px));
      margin: 0 auto;
      padding: 60px 0 80px;
    }

    h1 {
      margin: 0 0 48px;
      text-align: center;
      font-size: 32px;
      font-weight: 600;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 22px;
      font-weight: 600;
    }

    .section {
      padding: 30px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .section:first-of-type {
      border-top: 1px solid #e5e5e5;
    }

    .info-row {
      margin-bottom: 14px;
    }

    .label {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
      color: #777;
    }

    .value {
      font-size: 17px;
    }

    .tel-link {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* =========================
       Googleマップ
    ========================= */

    .map-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: #fff;
      font-weight: 600;
    }

    .map-button:hover {
      background: #f5f5f5;
    }

    /* =========================
       戻る

    .back {

      text-align: center;
    }

      padding: 12px 24px;

        font-size: 27px;
      }

      h2 {
