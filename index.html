    .hero {

      align-items: center;
      justify-content: center;
      text-align: center;

      color: #fff;

    .hero > div { transform: translateY(35px); }

    .hero h1 {
      margin: 0;
      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Noto Serif JP",
        serif;
      font-size: 42px;

      font-weight: 600;
    }

    .hero p {

    .container {

    section { padding: 64px 0; }

    .section-title {
      text-align: center;
      font-size: 28px;
      margin: 0 0 32px;

      border: 1px solid #ddd;

    }

    .news-date {
      font-size: 14px;
      color: #777;
      margin-bottom: 6px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 600;
    }

    .news-item {
      padding: 16px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .news-item:first-child {

    }

    .news-item:last-child {
      padding-bottom: 0;

    }

    .menu-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .menu-card {
      flex: 0 1 calc((100% - 40px) / 3);
      min-width: 220px;
      min-height: 140px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background: #fff;
      transition: 0.2s;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .menu-card h3 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .menu-card p {
      margin: 0;
      font-size: 15px;
      color: #666;
    }

    .line-section {
      background: #f6f6f4;
      text-align: center;
    }

    .line-copy {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .line-text {
      margin-bottom: 28px;
      font-size: 17px;
    }

    .line-button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-weight: 600;
    }

    .line-button:hover { background: #111; }

    footer {
      padding: 40px 20px;
      background: #222;
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.9;
    }

    @media (max-width: 768px) {
      .hero { min-height: 320px; }
      .hero > div { transform: translateY(20px); }
      .hero h1 { font-size: 30px; }
      .hero p { font-size: 16px; }
      section { padding: 44px 0; }
      .section-title { font-size: 24px; }
      .menu-grid { gap: 12px; }
      .menu-card {
        flex: 0 1 calc(50% - 6px);
        min-width: 0;
        min-height: 120px;
        padding: 20px 14px;
      }
      .menu-card h3 { font-size: 18px; }
      .menu-card p { font-size: 14px; }
      .line-copy { font-size: 21px; }
    }

    @media (max-width: 430px) {
      .container { width: min(100% - 24px, 1100px); }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div>
      <h1>松久山 禅昌寺</h1>

  </header>

  <section class="news" id="newsSection">
    <div class="container">
      <h2 class="section-title">最新のお知らせ</h2>
      <div class="news-box" id="newsList"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <h2 class="section-title">ご案内</h2>

      <div class="menu-grid">
        <a href="events.html" class="menu-card">
          <h3>年間行事</h3>
          <p>禅昌寺の年間法要・行事</p>
        </a>

        <a href="learning.html" class="menu-card">
          <h3>体験・学び</h3>
          <p>坐禅・写経・仏教のお話</p>
        </a>

        <a href="access.html" class="menu-card">
          <h3>アクセス</h3>
          <p>所在地・駐車場</p>
        </a>

        <a href="memorial.html" class="menu-card">
          <h3>中陰・年回表</h3>
          <p>命日から法要日を確認</p>
        </a>

        <a href="contact.html" class="menu-card">
          <h3>お問い合わせ</h3>
          <p>LINE・電話でのご相談</p>
        </a>
      </div>
    </div>
  </section>

  <section class="line-section">
    <div class="container">
      <div class="line-copy">禅昌寺公式LINE</div>
      <div class="line-text">
        年間行事や各種ご案内、ご命日登録などをご利用いただけます。
      </div>

      <!--
        禅昌寺公式LINEのプロフィールページへ移動します。
      -->
      <a href="#" class="line-button" id="lineProfileLink">
        禅昌寺公式LINEを見る
      </a>
    </div>
  </section>

  <footer>
    <div>禅昌寺</div>
    <div>〒092-0235 北海道網走郡津別町幸町69-2</div>
    <div>TEL 0152-76-2613</div>
  </footer>

  <script>
    "use strict";

    /*
      ============================================================
      年間行事 自動お知らせ連携
      ============================================================
      1) Google Apps Script 側で年間行事の日付を一元管理
      2) 春分の日・秋分の日もGoogle「日本の祝日」から自動取得
      3) 法要日の翌日から「厳修しました」と表示
      4) 年間法要と臨時のお知らせを新しい順にまとめる
      5) 最新のお知らせから40日以内のものを最大3件表示
      6) GASからは通常JSONをfetchで取得する

      GASをWebアプリとしてデプロイした後、下のURLだけ設定してください。
    */
    const ANNUAL_EVENTS_GAS_URL = "https://script.google.com/macros/s/AKfycbz4gc45OLf9YPheIjHh_MFVLH3S1PBv7s1DBr1czwDdn_E2GSM8Ts1Qw44wxYVH3gTFKw/exec";

    /*
      臨時のお知らせ。
      必要なときだけ追加します。expiresAfterDays を過ぎると自動で候補から外れます。
    */
    const manualNews = [
      {
        date: "2026-08-20",
        title: "禅昌寺公式サイトを公開しました",
        expiresAfterDays: 90
      }
    ];

    function localIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function japaneseDate(iso) {
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso;
      return `${Number(m[1])}年${Number(m[2])}月${Number(m[3])}日`;
    }

    function dayDiff(fromIso, toIso) {
      const a = new Date(fromIso + "T12:00:00");
      const b = new Date(toIso + "T12:00:00");
      return Math.floor((b - a) / (1000 * 60 * 60 * 24));
    }

    function selectRecentNews(annualEvents) {
      const todayIso = localIsoDate(new Date());
      const candidates = [];

      // 年間法要は「終わった後」に出すため、当日は表示せず翌日から候補にする。
      (annualEvents || []).forEach(event => {
        if (!event || !event.date || event.date >= todayIso) return;
        candidates.push({
          date: event.date,
          title: event.noticeTitle || `${event.name}を厳修しました`,
          kind: "annual"
        });
      });

      // 臨時のお知らせ
      manualNews.forEach(item => {
        if (!item.date || item.date > todayIso) return;

        const elapsed = dayDiff(item.date, todayIso);
        if (
          Number.isFinite(item.expiresAfterDays) &&
          elapsed > item.expiresAfterDays
        ) {
          return;
        }

        candidates.push({
          date: item.date,
          title: item.title,
          kind: "manual"
        });
      });

      // 新しい順に並べる
      candidates.sort((a, b) => b.date.localeCompare(a.date));

      if (candidates.length === 0) {
        return [];
      }

      // 最新のお知らせから40日以内にあるものだけを、最大3件表示する。
      const newestDate = candidates[0].date;

      return candidates
        .filter(item => dayDiff(item.date, newestDate) <= 40)
        .slice(0, 3);
    }

    function renderNews(annualEvents) {
      const news = selectRecentNews(annualEvents);
      const section = document.getElementById("newsSection");
      const list = document.getElementById("newsList");

      if (!news.length) {
        section.style.display = "none";
        return;
      }

      list.innerHTML = "";

      news.forEach(item => {
        const wrapper = document.createElement("div");
        wrapper.className = "news-item";

        const date = document.createElement("div");
        date.className = "news-date";
        date.textContent = japaneseDate(item.date);

        const title = document.createElement("div");
        title.className = "news-title";
        title.textContent = item.title;

        wrapper.appendChild(date);
        wrapper.appendChild(title);
        list.appendChild(wrapper);
      });

      section.style.display = "block";
    }

    async function loadAnnualEvents() {
      // GAS URL未設定でも、臨時のお知らせは従来どおり表示できる。
      if (!ANNUAL_EVENTS_GAS_URL) {
        renderNews([]);
        return;
      }

      const separator = ANNUAL_EVENTS_GAS_URL.includes("?") ? "&" : "?";
      const url = ANNUAL_EVENTS_GAS_URL + separator +
        "action=annualEvents&_=" + Date.now();

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();

        if (payload && payload.ok && Array.isArray(payload.events)) {
          renderNews(payload.events);
        } else {
          renderNews([]);
        }
      } catch (error) {
        console.error("年間行事データの取得に失敗しました。", error);
        renderNews([]);
      }
    }

    loadAnnualEvents();

    /* 禅昌寺公式LINE */
    const LINE_PROFILE_URL = "https://lin.ee/x5iZU2J";
    const lineProfileLink = document.getElementById("lineProfileLink");

    if (LINE_PROFILE_URL) {
      lineProfileLink.href = LINE_PROFILE_URL;
      lineProfileLink.target = "_blank";
      lineProfileLink.rel = "noopener noreferrer";
    }
  </script>
</body>
</html>
