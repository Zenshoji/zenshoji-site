  <script>
    "use strict";

    /*
      ============================================================
      トップ写真スライド
      ============================================================
      写真を増やす場合は、hero-slides 内へ hero-slide を追加します。
      写真が1枚だけの間は、自動再生・矢印・スワイプ切替を停止します。
    */
    const hero = document.getElementById("hero");
    const heroSlides = Array.from(
      document.querySelectorAll(".hero-slide")
    );
    const heroPrev = document.getElementById("heroPrev");
    const heroNext = document.getElementById("heroNext");
    const heroReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );
    const HERO_DISPLAY_TIME = 7000;
    const HERO_TRANSITION_TIME = 1200;

    let heroIndex = 0;
    let heroTimer = null;
    let heroAnimating = false;
    let heroTouchStartX = 0;
    let heroTouchStartY = 0;

    function setHeroSlideAccessibility() {
      heroSlides.forEach((slide, index) => {
        slide.setAttribute(
          "aria-hidden",
          index === heroIndex ? "false" : "true"
        );
      });
    }

    function stopHeroAutoplay() {
      if (heroTimer) {
        window.clearTimeout(heroTimer);
        heroTimer = null;
      }
    }

    function startHeroAutoplay() {
      stopHeroAutoplay();

      if (
        heroSlides.length < 2 ||
        heroReducedMotion.matches ||
        document.hidden
      ) {
        return;
      }

      heroTimer = window.setTimeout(() => {
        showHeroSlide(heroIndex + 1, 1, false);
      }, HERO_DISPLAY_TIME);
    }

    function showHeroSlide(nextIndex, direction, manual) {
      if (heroAnimating || heroSlides.length < 2) return;

      const normalizedIndex =
        (nextIndex + heroSlides.length) % heroSlides.length;

      if (normalizedIndex === heroIndex) return;

      heroAnimating = true;
      stopHeroAutoplay();

      const currentSlide = heroSlides[heroIndex];
      const nextSlide = heroSlides[normalizedIndex];
      const enteringClass = direction > 0 ? "from-right" : "from-left";
      const leavingClass = direction > 0 ? "to-left" : "to-right";

      nextSlide.classList.add("is-entering", enteringClass);

      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => {
          currentSlide.classList.add("is-leaving", leavingClass);
          currentSlide.classList.remove("is-active");
          nextSlide.classList.remove(enteringClass);
          nextSlide.classList.add("is-active");

          window.setTimeout(() => {
            currentSlide.classList.remove("is-leaving", leavingClass);
            nextSlide.classList.remove("is-entering");
            heroIndex = normalizedIndex;
            heroAnimating = false;
            setHeroSlideAccessibility();
            startHeroAutoplay();
          }, heroReducedMotion.matches ? 10 : HERO_TRANSITION_TIME);
        });
      });

      if (manual) {
        hero.dataset.lastManualChange = String(Date.now());
      }
    }

    if (heroSlides.length > 1) {
      hero.classList.add("has-multiple");

      heroPrev.addEventListener("click", () => {
        showHeroSlide(heroIndex - 1, -1, true);
      });

      heroNext.addEventListener("click", () => {
        showHeroSlide(heroIndex + 1, 1, true);
      });

      hero.addEventListener(
        "touchstart",
        event => {
          const touch = event.changedTouches[0];
          heroTouchStartX = touch.clientX;
          heroTouchStartY = touch.clientY;
        },
        { passive: true }
      );

      hero.addEventListener(
        "touchend",
        event => {
          const touch = event.changedTouches[0];
          const diffX = touch.clientX - heroTouchStartX;
          const diffY = touch.clientY - heroTouchStartY;

          if (
            Math.abs(diffX) < 45 ||
            Math.abs(diffX) <= Math.abs(diffY)
          ) {
            return;
          }

          showHeroSlide(
            heroIndex + (diffX < 0 ? 1 : -1),
            diffX < 0 ? 1 : -1,
            true
          );
        },
        { passive: true }
      );
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopHeroAutoplay();
      } else {
        startHeroAutoplay();
      }
    });

    heroReducedMotion.addEventListener("change", startHeroAutoplay);
    setHeroSlideAccessibility();
    startHeroAutoplay();

    /*
      ============================================================
      年間行事 自動お知らせ連携
      ============================================================
      1) Google Apps Script 側で年間行事の日付を一元管理
      2) 春分の日・秋分の日もGoogle「日本の祝日」から自動取得
      3) 法要日の翌日から「厳修しました」と表示
      4) 年間法要と臨時のお知らせを新しい順にまとめる
      5) 最新のお知らせから40日以内のものを最大3件表示
      6) GASからは通常JSONをfetchで取得する

      GASをWebアプリとしてデプロイした後、下のURLだけ設定してください。
    */
    const ANNUAL_EVENTS_GAS_URL = "https://script.google.com/macros/s/AKfycbz4gc45OLf9YPheIjHh_MFVLH3S1PBv7s1DBr1czwDdn_E2GSM8Ts1Qw44wxYVH3gTFKw/exec";

    /*
      臨時のお知らせ。
      必要なときだけ追加します。expiresAfterDays を過ぎると自動で候補から外れます。
    */
    const manualNews = [
      {
        date: "2026-08-30",
        title: "「学び」に新しいコラムを掲載しました",
        url: "learning.html",
        expiresAfterDays: 90
      },
      {
        date: "2026-08-20",
        title: "禅昌寺公式サイトを公開しました",
        expiresAfterDays: 90
      }
    ];

    function localIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function japaneseDate(iso) {
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso;
      return `${Number(m[1])}年${Number(m[2])}月${Number(m[3])}日`;
    }

    function dayDiff(fromIso, toIso) {
      const a = new Date(fromIso + "T12:00:00");
      const b = new Date(toIso + "T12:00:00");
      return Math.floor((b - a) / (1000 * 60 * 60 * 24));
    }

    function selectRecentNews(annualEvents) {
      const todayIso = localIsoDate(new Date());
      const candidates = [];

      // 年間法要は「終わった後」に出すため、当日は表示せず翌日から候補にする。
      (annualEvents || []).forEach(event => {
        if (!event || !event.date || event.date >= todayIso) return;
        candidates.push({
          date: event.date,
          title: event.noticeTitle || `${event.name}を厳修しました`,
          kind: "annual"
        });
      });

      // 臨時のお知らせ
      manualNews.forEach(item => {
        if (!item.date || item.date > todayIso) return;

        const elapsed = dayDiff(item.date, todayIso);
        if (
          Number.isFinite(item.expiresAfterDays) &&
          elapsed > item.expiresAfterDays
        ) {
          return;
        }

        candidates.push({
          date: item.date,
          title: item.title,
          url: item.url || "",
          kind: "manual"
        });
      });

      // 新しい順に並べる
      candidates.sort((a, b) => b.date.localeCompare(a.date));

      if (candidates.length === 0) {
        return [];
      }

      // 最新のお知らせから40日以内にあるものだけを、最大3件表示する。
      const newestDate = candidates[0].date;

      return candidates
        .filter(item => dayDiff(item.date, newestDate) <= 40)
        .slice(0, 3);
    }

    function renderNews(annualEvents) {
      const news = selectRecentNews(annualEvents);
      const section = document.getElementById("newsSection");
      const list = document.getElementById("newsList");

      if (!news.length) {
        section.style.display = "none";
        return;
      }

      list.innerHTML = "";

      news.forEach(item => {
        const wrapper = document.createElement("div");
        wrapper.className = "news-item";

        const date = document.createElement("div");
        date.className = "news-date";
        date.textContent = japaneseDate(item.date);

        const title = document.createElement("div");
        title.className = "news-title";

        if (item.url) {
          const link = document.createElement("a");
          link.href = item.url;
          link.textContent = item.title;
          title.appendChild(link);
        } else {
          title.textContent = item.title;
        }

        wrapper.appendChild(date);
        wrapper.appendChild(title);
        list.appendChild(wrapper);
      });

      section.style.display = "block";
    }

    async function loadAnnualEvents() {
      // GAS URL未設定でも、臨時のお知らせは従来どおり表示できる。
      if (!ANNUAL_EVENTS_GAS_URL) {
        renderNews([]);
        return;
      }

      const separator = ANNUAL_EVENTS_GAS_URL.includes("?") ? "&" : "?";
      const url = ANNUAL_EVENTS_GAS_URL + separator +
        "action=annualEvents&_=" + Date.now();

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();

        if (payload && payload.ok && Array.isArray(payload.events)) {
          renderNews(payload.events);
        } else {
          renderNews([]);
        }
      } catch (error) {
        console.error("年間行事データの取得に失敗しました。", error);
        renderNews([]);
      }
    }

    loadAnnualEvents();

    /* 禅昌寺公式LINE */
    const LINE_PROFILE_URL = "https://lin.ee/x5iZU2J";
    const lineProfileLink = document.getElementById("lineProfileLink");

    if (LINE_PROFILE_URL) {
      lineProfileLink.href = LINE_PROFILE_URL;
      lineProfileLink.target = "_blank";
      lineProfileLink.rel = "noopener noreferrer";
    }
  </script>
</body>
</html>
