<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません | 禅昌寺</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.8;
    }
    a { color: inherit; text-decoration: none; }
    header { padding: 26px 20px; border-bottom: 1px solid #ddd; }
    .header-inner { width: min(1000px, calc(100% - 20px)); margin: 0 auto; }
    .site-name {
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: .12em;
    }
    main {
      width: min(680px, calc(100% - 40px));
      margin: auto;
      padding: 70px 0;
      text-align: center;
    }
    .code { margin: 0 0 8px; color: #777; font-size: 15px; letter-spacing: .14em; }
    h1 { margin: 0 0 20px; font-size: 30px; font-weight: 600; }
    p { margin: 0; color: #666; }
    .back { margin-top: 38px; }
    .back a {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      font-weight: 600;
    }
    .back a:hover { background: #f6f6f4; }
    @media (max-width: 700px) {
      header { padding: 20px 16px; }
      .site-name { font-size: 20px; }
      main { width: min(100% - 28px, 680px); padding: 54px 0; }
      h1 { font-size: 25px; }
    }
  </style>
  <link rel="stylesheet" href="site-common.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/zenshoji-site/" class="site-name">松久山 禅昌寺</a>
    </div>
  </header>
  <main>
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは、移動または削除された可能性があります。</p>
    <div class="back">
      <a href="/zenshoji-site/">トップページへ戻る</a>
    </div>
  </main>

<footer class="site-common-footer">
  <div class="site-common-meta"><a href="privacy.html">個人情報の取り扱い</a><span>© 松久山 禅昌寺</span></div>
